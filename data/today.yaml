  - title: Tiny 3D-printed color routers could enable sharper and brighter low-light
      photography
    url: https://techxplore.com/news/2026-10-tiny-3d-routers-enable-sharper.html
    summary: Almost every sensor in a digital photography device, from a smartphone
      to a digital camera, relies on color filters to separate incoming light
      into red, green and blue before it reaches the sensor. Substantial light
      is lost through the process, however, and in dim conditions, this results
      in images with higher noise, longer exposures and more motion blur. The
      most conventional configuration, a Bayer filter array, transmits only
      about a third of the light striking it.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/routing-the-way-to-sha.jpg
    categories:
      - Engineering
    publishedAt: 2026-10-22T20:20:16.000Z
