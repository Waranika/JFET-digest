  - title: AI can now control fusion plasma faster than humans can react
    url: https://www.sciencedaily.com/releases/2026/09/260903064215.htm
    summary: Princeton researchers have tested an AI system that can monitor and
      control fusion plasma in milliseconds, reacting far faster than a human
      operator. In one experiment, it predicted a damaging instability about 200
      milliseconds before it appeared and adjusted the plasma to stop it from
      forming.
    imageUrl: https://www.sciencedaily.com/images/1920/pacman-artificial-intelligence-framework-for-fusion-systems.webp
    categories: []
    publishedAt: 2026-09-06T07:28:43.000Z
    source: ScienceDaily — Robotics
  - title: Iron could make high-energy sodium-ion batteries last longer
    url: https://techxplore.com/news/2026-09-iron-high-energy-sodium-ion.html
    summary: Lithium-ion batteries (LiBs), which charge and discharge by moving
      lithium ions between two electrodes known as the cathode and anode, remain
      the most widely used rechargeable batteries worldwide. Over the past
      decades, however, energy engineers have been assessing the potential of
      alternative rechargeable batteries based on different materials and ions.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/iron-could-make-high-e-1.jpg
