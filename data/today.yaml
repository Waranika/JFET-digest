  - title: I Don’t Trust Visual Recordings Anymore. But One Day I Will Again
    url: https://spectrum.ieee.org/fighting-back-against-deep-fakes
    summary: In March of this year, a flurry of emails and text messages from a half
      dozen reporters around the world disrupted my quiet Saturday morning. An
      Iranian news agency had aired a week-old video of what appeared to be a
      U.S.-made Tomahawk missile hitting a school. News reports claimed that the
      strike killed more than 175 people, most of them children. The U.S.
      president and military denied responsibility. In the age of generative AI
      and all things deepfake, everyone—including me—was skeptical of the
      video’s authenticity.
    imageUrl: https://spectrum.ieee.org/media-library/photo-collage-of-a-mans-face-featuring-glitched-distortions-and-abstract-shapes.jpg?id=68721975&width=1245&height=700&coordinates=0%2C469%2C0%2C470
    categories:
      - Deepfakes
      - Generative-ai
      - Digital-forensics
      - Content-credentials
    publishedAt: 2026-11-20T14:00:03.000Z
    source: IEEE Spectrum — Computing & Chips
  - title: "This featherweight, flying robot carries its own sensors and computers "
    url: https://news.mit.edu/2026/featherweight-flying-robot-carries-its-own-sensors-and-computers-1118
    summary: Over the past decade, MIT researchers have developed aerial microrobots
      with bumblebee-like speed, agility, and durability, for tasks like
      precision agriculture or search-and-rescue. But these featherweight
      microrobots couldn’t carry the electronics needed for navigation, forcing
      them to remain connected to a motion-capture system in the lab.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202611/MIT-Onboard-Microbot-A1-press.jpg?itok=-TluzTJd
    categories: []
    publishedAt: 2026-11-18T19:00:00.000Z
    source: MIT Robotics
  - title: Build a Hidden Lock With a Magnetic Imager
    url: https://spectrum.ieee.org/magnetic
    summary: Like many a nerd, I have a certain fascination with locks. This
      originates in reading the memoir Surely You’re Joking, Mr. Feynman as a
      teenager, in which Richard Feynman recounts picking locks and cracking
      combinations while at his day job working on the Manhattan Project at Los
      Alamos. I currently have a couple of locksport pick sets and training
      locks that I purchased at hacker conferences over the years (although I’m
      still terrible at it), and I delight in the YouTube exploits of folks like
      the LockPickingLawyer.
    imageUrl: https://spectrum.ieee.org/media-library/a-medium-sized-box-with-an-open-lid-inside-is-a-lock-mechanism-a-battery-pack-and-some-circuit-boards.png?id=68493268&width=1245&height=700&coordinates=0%2C385%2C0%2C386
    categories:
      - Physical-security
      - Typedepartments
      - Lock
      - Magnetic-imaging
      - Teensy
    publishedAt: 2026-10-26T13:00:02.000Z
