  - title: Seeing beneath the surface during metal additive manufacturing
    url: https://techxplore.com/news/2026-08-beneath-surface-metal-additive.html
    summary: When we watch a metal part being built by laser-based metal additive
      manufacturing (AM), we're only seeing part of the story. In one kind of
      metal AM process, a high-powered laser sweeps across a bed of metal
      powder, creating a tiny pool of molten material—often a few human hairs
      wide. In a fraction of a second, the metal powder beneath the moving laser
      spot heats up, melts, flows and solidifies into continuous metal.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/seeing-beneath-the-sur.jpg
    categories:
      - Engineering
    publishedAt: 2026-08-21T20:20:05.000Z
