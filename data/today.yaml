  - title: Inflatable FaBrick enables soft robots to contract, bend and twist
    url: https://techxplore.com/news/2026-11-inflatable-fabrick-enables-soft-robots.html
    summary: Soft robots that contract, bend, twist, rotate or stiffen can be built
      from the same pneumatically actuated fabric with easily accessible tools,
      according to a University of Michigan Engineering study. The fabric,
      embedded with a grid of inflatable pouches, earned the name FaBrick as the
      design drew inspiration from modular building blocks like LEGO bricks.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/soft-robotics-actuated.jpg
    categories:
      - Robotics
    publishedAt: 2026-11-25T13:40:13.000Z
