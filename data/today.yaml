  - title: MIT’s tiny flying robot gets 450% faster with AI
    url: https://www.sciencedaily.com/releases/2026/09/260921081114.htm
    summary: A new AI control system lets MIT’s tiny flying robot move with
      insect-like agility, boosting its speed by about 450 percent and allowing
