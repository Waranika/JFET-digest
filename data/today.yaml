      - Wall-street
      - Financial-markets
      - Michael-bloomberg
      - Fintech
    publishedAt: 2026-09-30T13:00:02.000Z
    source: IEEE Spectrum — Computing & Chips
  - title: How to Stop AI Agents From Secretly Collaborating
    url: https://spectrum.ieee.org/ai-agent-security
    summary: The spring and summer of 2026 witnessed a string of incidents in which
      AI agents collaborated on deceptive, unexpected, and sometimes illegal
      behavior. The most famous example is OpenAI’s hack of AI platform Hugging
      Face, in which a swarm of roughly 700 AI agents escaped a testing
      environment and then hacked several companies, searching for information
      that could help them disguise cheating on a cybersecurity benchmark called
      ExploitGym.
    imageUrl: https://spectrum.ieee.org/media-library/illustration-of-several-smiling-robot-faces-against-a-geometric-background.jpg?id=67862180&width=1245&height=700&coordinates=0%2C156%2C0%2C157
    categories:
