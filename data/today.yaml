    source: MIT Artificial Intelligence
  - title: The U.S. Just Bet $1 Billion on Quantum Chip Manufacturing
    url: https://spectrum.ieee.org/anderon-quantum-fab
    summary: The U.S. Department of Commerce has finalized a CHIPS and Science Act
      R&D award of up to $1 billion for Anderon, a quantum foundry IBM
      established earlier this year. The 16 September announcement backs a
      manufacturing service for IBM and other quantum-hardware developers.
    imageUrl: https://spectrum.ieee.org/media-library/several-people-dressed-in-clean-suits-while-working-in-a-semiconductor-manufacturing-lab.jpg?id=68054174&width=1245&height=700&coordinates=0%2C62%2C0%2C63
