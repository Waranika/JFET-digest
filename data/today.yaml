  - title: Melt it, spin it, use it again. This new recyclable yarn is as strong and
      stretchy as spandex-based yarns
    url: https://techxplore.com/news/2026-07-recyclable-yarn-strong-stretchy-spandex.html
    summary: After a closet cleanout, what options are there for recycling our old
      threads? Not many. Apart from bringing used clothes to a donation center,
      there is no process for recycling textiles like there is for bottles and
      cans. The average American throws out around 81 pounds of clothing each
      year. That amounts to more than 11 million tons of textiles that end up in
      landfills or incinerators.
