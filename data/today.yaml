  - title: Like a bird, this drone uses touch to grip branches and rest
    url: https://techxplore.com/news/2026-08-bird-drone-rest.html
    summary: Drones often hover in the air, noisy and whining. They can already be
      used for many tasks, but not when you need some quiet. Their batteries
      would also last longer if they could take a "rest" from time to time. But
      when a drone is monitoring a rainforest, its cluttered surroundings and
      its own gripper arm become too tricky for its camera-based vision. Until
      now.
