  - title: Today's downloads predict tomorrow's scientific impact—up to five years out
    url: https://techxplore.com/news/2026-08-today-downloads-tomorrow-scientific-impact.html
    summary: The trail of likes, shares and downloads we leave across the internet
      could help predict successful innovations years in advance, Cornell
      researchers showed by curating two datasets that allowed them to compare
      early engagement with future impact.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/todays-clicks-can-reve-1.jpg
