  - title: These Engineers Are Cleaning Up Connected Cars’ Security Flaws
    url: https://spectrum.ieee.org/connected-cars-security
    summary: Today’s connected vehicles collect and transmit far more personal data
      from drivers and passengers than their predecessors, with costly
      consequences. The Center for Automotive Management in Germany estimates
      that cyberattacks have caused more than $20 billion in damage to the auto
      industry as of 2025, twenty times higher than in 2022. This week,
      engineers and cybersecurity researchers are gathering in Bonn, Germany,
      for the Embedded Security in Cars (escar) conference to discuss using AI
      for defense, hardening chips, and otherwise securing the auto industry’s
      data handling.
    imageUrl: https://spectrum.ieee.org/media-library/a-tesla-sedan-parked-inside-a-testing-tent-made-of-high-metal-content-fabric.jpg?id=68696237&width=1200&height=400&coordinates=0%2C1042%2C0%2C1043
    categories:
      - Connected-vehicles
      - Connected-cars
      - Cybersecurity
      - Hacking-cars
    publishedAt: 2026-11-17T16:00:03.000Z
    source: IEEE Spectrum — Computing & Chips
  - title: Scientists tracked kids for 8 years. What they found about screen time
      was surprising
    url: https://www.sciencedaily.com/releases/2026/11/261116014725.htm
    summary: A surprising Finnish study found that children who spent more time
      using screens tended to have better cognitive processing abilities as
      teenagers, challenging the assumption that screen time is always harmful.
      Researchers suggest that what children do on screens may matter more than
      how much time they spend using them.
    imageUrl: https://www.sciencedaily.com/images/1920/cute-boy-staring-at-cell-phone-screen.webp
    categories: []
    publishedAt: 2026-11-17T12:03:58.000Z
    source: ScienceDaily — Computer Science
  - title: A material just one atom thick reveals a strange quantum secret
    url: https://www.sciencedaily.com/releases/2026/11/261115085554.htm
    summary: Researchers at the University of Osaka have discovered a remarkable
      quantum state forming at the boundary between a one-atom-thick material
      and a metal. They observed electrons behaving as though they were
      unusually heavy, including a previously unseen state created by
      interactions between the ultrathin layer and the copper beneath it. This
      first-of-its-kind observation reveals a promising new way to control
      exotic quantum behavior.
    imageUrl: https://www.sciencedaily.com/images/1920/heavy-fermion-at-interface.webp
    categories: []
    publishedAt: 2026-11-17T01:25:39.000Z
    source: ScienceDaily — Engineering
  - title: Can Robots Bring Stroke Surgery to Remote Hospitals?
    url: https://spectrum.ieee.org/telesurgery-stroke
    summary: I am practicing brain surgery on a patient lying 6 meters away, out of
      my sight and reach. I press a foot pedal, activating the controller in my
      hand, and carefully steer a thin flexible tube called a catheter up
      through the patient’s blood vessels. I head for what I believe to be the
      brain, tracking my progress on the live X-ray feed. As I imagine finding a
      blood clot, David Bell, the surgeon seated to my right, helpfully reminds
      me that every minute a stroke goes untreated, millions of brain cells
      suffocate, swell, and die.
    imageUrl: https://spectrum.ieee.org/media-library/remedy-robotics-n1-prototype-console-lower-left-sits-ready-to-guide-a-catheter-through-blood-vessels-using-a-ct-scan-overlai.jpg?id=68671534&width=1245&height=700&coordinates=0%2C2%2C0%2C2
    categories:
      - Surgery
      - Telecommunications
      - Hospitals
      - Surgical-robots
      - Stroke-treatment
      - Stroke
    publishedAt: 2026-11-16T14:00:02.000Z
    source: IEEE Spectrum — Robotics
  - title: AI discovers a hidden heart signal that could predict sudden death
    url: https://www.sciencedaily.com/releases/2026/11/261112230456.htm
    summary: Scientists have uncovered a hidden warning sign in routine heart scans
      that could predict sudden cardiac death before it strikes. The AI-powered
      discovery outperformed conventional screening methods, potentially
      revealing thousands of people at risk of a fatal heart malfunction that
      doctors might otherwise miss.
    imageUrl: https://www.sciencedaily.com/images/1920/cardiology-heart-attack-disease-prevention.webp
    categories: []
    publishedAt: 2026-11-15T01:05:10.000Z
