      - Robot-hands
      - Robot-hand
      - Sensors
      - Tactile-sensors
    publishedAt: 2026-07-28T15:00:03.000Z
    source: IEEE Spectrum — Robotics
  - title: Why NIST Researchers Spent 10 Years Measuring Gravity
    url: https://spectrum.ieee.org/universal-gravitational-constant-nist-schlamminger
    summary: Physicists have been trying to measure the fundamental gravitational
      constant for well over two centuries. The current accepted value of big G,
      as it’s known, is 6.67430 × 10-11 cubic meters per kilogram per square
      second. It also has an uncertainty of ±0.00015 × 10-11 m3/(kg s2). As far
      as constants of the universe go, that’s very uncertain.
    imageUrl: https://spectrum.ieee.org/media-library/smiling-man-in-glasses-overlaid-with-scientific-diagrams-and-colorful-geometric-shapes.png?id=67527858&width=1245&height=700&coordinates=0%2C102%2C0%2C103
    categories:
