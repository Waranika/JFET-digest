  - title: AI giants promise publishers new way to block some scraping
    url: https://techxplore.com/news/2026-10-ai-giants-publishers-block.html
    summary: OpenAI, Google, Microsoft and Anthropic pledged on Friday to give media
      outlets and other websites a single way to prevent their content from
      being scraped to train artificial intelligence (AI) models, amid growing
      criticisms and legal battles from news publishers.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/anthropic-2.jpg
    categories:
