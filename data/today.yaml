  - title: AI models nearly erase female characters when they write kids stories
      about animals
    url: https://techxplore.com/news/2026-08-ai-erase-female-characters-kids.html
    summary: Last year, Melanie Walsh, a University of Washington assistant
      professor in the Information School, wrote an article examining how 300
      popular children's books gendered their animal characters. Of the 13 most
      common animals, most were male—unless they happened to be cats, ducks or
      birds, which trended slightly more female. But a frog, a wolf? More than a
      90% chance it was a "he."
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/cartoon-animals.jpg
    categories:
      - Consumer & Gadgets
    publishedAt: 2026-08-05T20:20:06.000Z
