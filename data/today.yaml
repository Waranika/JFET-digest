  - title: How an MIT research project became a global programming language
    url: https://news.mit.edu/2026/how-mit-research-project-became-global-programming-language-0831
    summary: It all started with some exasperated emails. Back in 2009, a group of
      researchers began venting their frustration with the programming languages
      designed to help scientists and other researchers perform complex
      mathematical operations and statistical simulations without learning how
      to code. These programming languages were rigid and slow. If scientists
      built something that really worked, they’d need to rewrite the entire
      program in another language just to run it more quickly.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202608/MIT-JuliaHubDyad-01-press.jpg?itok=vvjznZ8d
    categories: []
    publishedAt: 2026-08-31T04:00:00.000Z
    source: MIT Artificial Intelligence
  - title: Controlled crumples give inflatable membranes multiple stable shapes for
      adaptable designs
    url: https://techxplore.com/news/2026-08-crumples-inflatable-membranes-multiple-stable.html
    summary: Inflatable structures are all around us, from pool floaties and
      archways at the Tour de France to life-saving emergency resuscitators and
      vehicle airbags. As useful as these structures are, they are limited to
      only two stable states—inflated and deflated.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/when-crumples-arent-fl.jpg
    categories:
