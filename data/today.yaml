    source: MIT Engineering
  - title: "Architected fillers: Shape becomes a design variable for composites"
    url: https://techxplore.com/news/2026-11-architected-fillers-variable-composites.html
    summary: In a recent study, researchers in materials science at Tampere
      University challenged conventional composite filler shapes by introducing
      a different approach in which each particle's 3D geometry is designed
      first, then printed to specification. The research enables decisions to be
      made on the shape of the filler, not only its material. This approach
      using architected fillers could pave the way for new solutions in soft
      robotics, biomedical materials with tailored stiffness and printed
      scaffolds for tissue engineering.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/architected-fillers-sh-1.jpg
    categories:
      - Engineering
    publishedAt: 2026-11-09T22:20:21.000Z
    source: TechXplore — Engineering
