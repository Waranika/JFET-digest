  - title: AI searched 100 million possibilities and found a cheaper way to 3D-print
      a NASA rocket alloy
    url: https://www.sciencedaily.com/releases/2026/08/260827010504.htm
    summary: Researchers used AI to search through more than 100 million possible
      settings for 3D-printing a high-performance NASA alloy. After only 40
      experiments, the system identified six successful configurations,
      including one that worked at a record-low 500 watts. That could allow
      GRCop-42, currently difficult and expensive to print, to be made with much
      more widely available equipment.
    imageUrl: https://www.sciencedaily.com/images/1920/3d-printing-metal-parts-close.webp
    categories: []
    publishedAt: 2026-08-27T13:08:01.000Z
    source: ScienceDaily — Robotics
  - title: MIT engineers design a better controller for operating construction diggers
    url: https://news.mit.edu/2026/mit-engineers-design-better-controller-operating-construction-diggers-0820
    summary: Anyone who’s ever wrestled with a claw machine at an arcade can
      appreciate the difficulty in pulling and pushing on joysticks, in just the
      right way, to get a mechanical arm to scoop up that one special toy.
      Coordinating the joysticks and connecting their movement to the claw’s
      motion is a type of “mental mapping” that is not immediately intuitive.
      (And it’s what arcade owners depend on to bring players back, again and
      again).
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202608/MIT-DiggerTrainer-01-press.jpg?itok=X5SSiyJU
    categories: []
    publishedAt: 2026-08-20T04:00:00.000Z
    source: MIT Robotics
