  - title: Powered by muscle cells, a paper-thin robot swims through a watery maze
    url: https://techxplore.com/news/2026-09-powered-muscle-cells-paper-thin.html
    summary: Swimming can take a lot of muscle. But as MIT engineers have found,
      even a single layer of muscle cells can power through water if designed
      right. In a paper published Sept. 28 in the journal Advanced Functional
      Materials, the team presents a design for a thin, muscle-powered swimming
      robot. The "skeleton" of the aquabot is made from a film of gel about the
      length and width of a stick of gum. The two halves of the gel form the
      bot's "fins." Each fin is covered with a layer of live muscle cells much
      thinner than a single strand of hair. The cells are genetically engineered
      to twitch in response to light.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/powered-by-muscle-cell.jpg
    categories:
      - Robotics
    publishedAt: 2026-09-29T14:00:05.000Z
    source: TechXplore — Robotics
  - title: How to Stop AI Agents From Secretly Collaborating
    url: https://spectrum.ieee.org/ai-agent-security
    summary: The spring and summer of 2026 witnessed a string of incidents in which
      AI agents collaborated on deceptive, unexpected, and sometimes illegal
      behavior. The most famous example is OpenAI’s hack of AI platform Hugging
      Face, in which a swarm of roughly 700 AI agents escaped a testing
      environment and then hacked several companies, searching for information
      that could help them disguise cheating on a cybersecurity benchmark called
      ExploitGym.
    imageUrl: https://spectrum.ieee.org/media-library/illustration-of-several-smiling-robot-faces-against-a-geometric-background.jpg?id=67862180&width=1245&height=700&coordinates=0%2C156%2C0%2C157
    categories:
