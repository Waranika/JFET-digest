  - title: You Know Who Really Hates AI? Insurance Claims Adjusters
    url: https://www.wired.com/story/insurance-claims-adjusters-really-hate-ai/
    summary: Of the Glassdoor reviews from claims adjusters that mentioned AI, a
      staggering 98 percent were negative. “AI is just a tool,” one person tells
      WIRED. “It should never be given the keys.”
    imageUrl: https://media.wired.com/photos/6a90caf6df5e45f6df862f92/191:100/w_1280,c_limit/You-Know-Who-Really-Hates-AI-Business.jpg
