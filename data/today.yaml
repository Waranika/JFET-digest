  - title: Brain-inspired randomness makes artificial vision more reliable
    url: https://techxplore.com/news/2026-10-brain-randomness-artificial-vision-reliable.html
    summary: Humans are usually remarkably good at recognizing objects, even under
      poor conditions. Artificial vision systems, by contrast, reach their
      limits more quickly. Researchers at the Hertie Institute for Clinical
      Brain Research have now investigated what artificial vision systems can
      learn from the brain. They found that combining two brain-inspired
      features can make image recognition considerably more reliable. The
      research findings are published in the journal Patterns.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/brain-research-how-ran.jpg
    categories:
      - Machine learning & AI
    publishedAt: 2026-10-20T19:40:23.000Z
