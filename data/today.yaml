  - title: Three holographic layers steer red, green and blue light for brighter AR
      displays
    url: https://techxplore.com/news/2026-08-holographic-layers-red-green-blue.html
    summary: Researchers have developed a full-color near-eye display that uses
      three stacked holographic gratings, each engineered to direct red, green
      or blue light. The new design could help advance compact, energy-efficient
      augmented reality (AR) glasses for use in a variety of professional and
      consumer applications.
