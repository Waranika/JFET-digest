  - title: Out-of-sync sleep schedules may steer people toward AI for dating and job
      assessments
    url: https://techxplore.com/news/2026-10-sync-people-ai-dating-job.html
    summary: Life often gets in the way of going to bed in sync with our circadian
      rhythm and getting enough sleep. Work, school and other social commitments
      can pull our schedules out of step, and scientists call this mismatch
      social jet lag. When people experience this sleep mismatch, they feel
      tired and off their game. This jet lag can often trigger social anxiety
      and worry about being judged negatively by others.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/social-jetlag-may-make.jpg
    categories:
      - Consumer & Gadgets
    publishedAt: 2026-10-06T11:00:01.000Z
    source: TechXplore — AI & Machine Learning
