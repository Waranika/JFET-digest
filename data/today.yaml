  - title: Robot Finger Feels in Color
    url: https://spectrum.ieee.org/robot-finger
    summary: Imagine running your fingertip over the surface of a U.S. penny. You
      would feel the ridges of the raised letters and numbers, Abe Lincoln’s
      bearded side profile, and, if it’s tails, the fluted columns of the
      Lincoln Memorial. Getting a robot to sense the same things is an imposing
      task, often requiring gathering data on pressure and force at many spatial
      locations at once. But that’s just what a team of scientists in Europe has
      now managed to do, using an unusual, colorful robotic skin that provides
      high-resolution sensing in real time.
    imageUrl: https://spectrum.ieee.org/media-library/close-up-of-a-sensor-for-a-robotic-fingertip-and-raised-relief-images-of-a-leaf-and-a-u-s-penny.jpg?id=67542077&width=1200&height=800&coordinates=0%2C83%2C0%2C84
    categories:
      - Soft-robotics
      - Robot-hands
      - Robot-hand
      - Sensors
      - Tactile-sensors
    publishedAt: 2026-07-28T15:00:03.000Z
    source: IEEE Spectrum — Robotics
  - title: Why NIST Researchers Spent 10 Years Measuring Gravity
    url: https://spectrum.ieee.org/universal-gravitational-constant-nist-schlamminger
    summary: Physicists have been trying to measure the fundamental gravitational
      constant for well over two centuries. The current accepted value of big G,
      as it’s known, is 6.67430 × 10-11 cubic meters per kilogram per square
      second. It also has an uncertainty of ±0.00015 × 10-11 m3/(kg s2). As far
      as constants of the universe go, that’s very uncertain.
    imageUrl: https://spectrum.ieee.org/media-library/smiling-man-in-glasses-overlaid-with-scientific-diagrams-and-colorful-geometric-shapes.png?id=67527858&width=1200&height=600&coordinates=0%2C151%2C0%2C151
    categories:
      - Typedepartments
      - 5-questions
      - Physics
      - Nist
    publishedAt: 2026-07-28T13:00:01.000Z
    source: IEEE Spectrum — Computing & Chips
  - title: "MIT engineers design recyclable elastic yarn "
    url: https://news.mit.edu/2026/mit-engineers-design-recyclable-elastic-yarn-0727
    summary: After a closet cleanout, what options are there for recyling our old
      threads? Not many. Apart from bringing used clothes to a donation center,
      there is no process for recycling textiles like there is for bottles and
      cans. And, the average American throws out around 81 pounds of clothing
      each year. That amounts to more than 11 million tons of textiles that end
      up in the landfill or incinerator.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202607/MIT-RecyclableYarn-01-press.jpg?itok=IcF6kuYE
    categories: []
    publishedAt: 2026-07-27T14:00:00.000Z
    source: MIT Engineering
  - title: MIT’s new lidar chip could give self-driving cars a wider view
    url: https://www.sciencedaily.com/releases/2026/07/260722032127.htm
    summary: MIT engineers have found a way to give chip-based lidar a wider,
      clearer view without relying on moving parts. Their design uses
      differently shaped antennas that can sit close together without scrambling
      one another’s signals. In tests, the system sharply reduced interference
      while steering a single precise beam across a broad field of view.
    imageUrl: https://www.sciencedaily.com/images/1920/mit-array-of-integrated-antennas.webp
    categories: []
    publishedAt: 2026-07-22T10:00:54.000Z
    source: ScienceDaily — Computer Science
  - title: New AI blood test predicts heart disease 15 years early
    url: https://www.sciencedaily.com/releases/2026/07/260716023603.htm
    summary: A new AI-powered blood test could give people a remarkably early
      warning of serious heart and circulation problems. Developed by
      researchers at the University of Hong Kong, CardiOmicScore analyzes
      thousands of proteins and metabolites to estimate the risk of six major
      cardiovascular diseases, including heart attack, stroke, heart failure,
      and atrial fibrillation. Unlike genetic risk scores, which remain fixed
      throughout life, the system captures biological changes linked to a
      person’s current health, lifestyle, and environment.
    imageUrl: https://www.sciencedaily.com/images/1920/ai-cardiology.webp
    categories: []
    publishedAt: 2026-07-19T14:58:00.000Z
    source: ScienceDaily — Robotics
