  - title: Scientists twist crystal layers and reshape matter from within
    url: https://www.sciencedaily.com/releases/2026/08/260801042819.htm
    summary: Researchers have found a way to build much larger “twisted” oxide
      materials while precisely controlling how their atomic layers line up.
      Because these materials can be made over large areas and transferred onto
      different surfaces, the technique could help turn twistronics from a
      laboratory curiosity into a practical platform for next-generation
      electronics.
    imageUrl: https://www.sciencedaily.com/images/1920/extending-limits-of-twistronics.webp
    categories: []
    publishedAt: 2026-08-03T04:36:48.000Z
    source: ScienceDaily — Engineering
  - title: MIT’s new lidar chip could give self-driving cars a wider view
    url: https://www.sciencedaily.com/releases/2026/07/260722032127.htm
    summary: MIT engineers have found a way to give chip-based lidar a wider,
      clearer view without relying on moving parts. Their design uses
      differently shaped antennas that can sit close together without scrambling
      one another’s signals. In tests, the system sharply reduced interference
      while steering a single precise beam across a broad field of view.
    imageUrl: https://www.sciencedaily.com/images/1920/mit-array-of-integrated-antennas.webp
    categories: []
    publishedAt: 2026-07-22T10:00:54.000Z
    source: ScienceDaily — Computer Science
