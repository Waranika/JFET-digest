  - title: Researchers develop cost-efficient method for detecting hallucinations in
      large language models
    url: https://techxplore.com/news/2026-09-efficient-method-hallucinations-large-language.html
    summary: Researchers from Skoltech and Sberbank's Center for Practical
      Artificial Intelligence have proposed a new method, TOHA, for detecting
      hallucinations in large language models operating in retrieval-augmented
      generation (RAG) systems. The approach analyzes the topological structure
      of a model's attention maps and makes it possible to identify responses
      that are not supported by the provided context. The method does not
      require training additional models and uses only a small amount of
      annotated data for configuration.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/large-language-model.jpg
    categories:
      - Computer Sciences
    publishedAt: 2026-09-02T20:40:04.000Z
