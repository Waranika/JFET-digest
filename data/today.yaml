  - title: MIT researchers are mapping extreme weather risks — and building tools to
      act on them
    url: https://news.mit.edu/2026/mit-researchers-mapping-extreme-weather-risks-building-tools-to-act-0918
    summary: Warming temperatures are fueling more extreme weather-related events —
      catastrophic floods, severe hurricanes and cyclones, and wildfires
      exacerbated by drought. But the tools used by local communities, emergency
      and public safety agencies, and insurance and risk markets have not kept
      pace with the up-to-date data and modeling for accurately predicting how
      these events will evolve.
