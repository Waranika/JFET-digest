  - title: Scientists are building a microscope powered by a quantum computer
    url: https://www.sciencedaily.com/releases/2026/09/260912220038.htm
    summary: Scientists are combining an electron microscope with a quantum computer
      to squeeze far more information from each electron. The approach could
      reveal faint details with fewer electrons, helping protect fragile samples
      that conventional microscopy can damage.
    imageUrl: https://www.sciencedaily.com/images/1920/artistic-visualization-of-quantum-electron-microscope.webp
    categories: []
    publishedAt: 2026-09-13T12:03:59.000Z
    source: ScienceDaily — Engineering
  - title: AI uncovers hidden Ozempic side effects across 400,000 Reddit posts
    url: https://www.sciencedaily.com/releases/2026/09/260912222856.htm
    summary: AI analysis of 400,000 Reddit posts found that users of drugs such as
      Ozempic, Wegovy, Mounjaro, and Zepbound reported unexpected symptoms
      including menstrual changes, chills, hot flashes, and fatigue. Researchers
      cannot say the medications caused these problems, but the patterns may
      reveal overlooked signals worth studying.
    imageUrl: https://www.sciencedaily.com/images/1920/woman-face-close-up-surprise-worry-fear.webp
    categories: []
    publishedAt: 2026-09-13T10:46:19.000Z
    source: ScienceDaily — Robotics
  - title: Tiny sound waves could help solve a major quantum computing problem
    url: https://www.sciencedaily.com/releases/2026/09/260911214245.htm
    summary: Researchers at Harvard have demonstrated a way to protect quantum
      information using microscopic sound waves. By continuously surrounding a
      diamond-based qubit with mechanical vibrations, they extended its
      coherence time by roughly threefold. The same phonons could eventually
      both transmit and protect quantum information, opening the door to compact
      sound-based quantum networks on chips.
    imageUrl: https://www.sciencedaily.com/images/1920/silicon-vacancy-center-in-diamond-crystal-lattice.webp
    categories: []
    publishedAt: 2026-09-12T14:08:20.000Z
    source: ScienceDaily — Computer Science
  - title: Make a Portable Wide-screen Mechanical TV
    url: https://spectrum.ieee.org/mechanical-tv-2677767814
    summary: I never intended to join the cutting edge of electromechanical
      television. I just wanted to make a nice clock. But sometimes you have to
      go where the engineering takes you, and in my case it took me to the
      Scanwheel, a pocket-size wide-screen electromechanical TV with a
      resolution of 4,096 by 20 pixels. Yup, that’s 4K by 20.
    imageUrl: https://spectrum.ieee.org/media-library/a-pocket-sized-drum-shaped-device-displaying-a-strip-of-frames-from-the-steamboat-willy-cartoon.png?id=67675118&width=1245&height=700&coordinates=0%2C17%2C0%2C17
