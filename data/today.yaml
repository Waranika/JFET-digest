  - title: Self-adjusting drone controls could make for smoother formation flying
    url: https://techxplore.com/news/2026-10-adjusting-drone-smoother-formation-flying.html
    summary: A new method for controlling groups of drones, technically known as
      unmanned aerial vehicles (UAVs), could make formation flying smoother and
      reduce energy consumption and mechanical wear, according to research in
      the International Journal of Systems, Control and Communications. The work
      combines fuzzy logic processing with a self-adjusting control system,
      known as a self-coupling proportional-integral-derivative (PID)
      controller.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/many-drones.jpg
    categories:
      - Robotics
    publishedAt: 2026-10-28T20:40:15.000Z
    source: TechXplore — Engineering
  - title: Systems Thinking Is Vital in the Age of AI
    url: https://spectrum.ieee.org/systems-thinking-vital-in-ai
    summary: Modern engineering projects increasingly combine human judgment with
      machine capability. An engineer can define a problem, then ask an
      artificial intelligence tool to search relevant research and technical
      standards, generate design options, test them in simulation, and compare
      the results. The engineer can then bring the results to specialists who
      understand the parts AI cannot judge on its own, such as whether a design
      can be built safely, whether it makes sense in a particular setting, or
      how it might affect its users. The final decision about whether and how to
      move forward remains a human responsibility.
    imageUrl: https://spectrum.ieee.org/media-library/illustration-of-a-robotic-and-a-human-hand-with-different-color-bands-wrapped-around-both-hands.jpg?id=68528703&width=1245&height=700&coordinates=0%2C125%2C0%2C125
    categories:
      - Ieee-member-news
      - Opinion
      - Careers
      - Ai
      - Type-ti
    publishedAt: 2026-10-28T18:00:02.000Z
    source: IEEE Spectrum — AI
  - title: A soft robot could help doctors diagnose and treat disorders of the small
      intestine
    url: https://news.mit.edu/2026/soft-robot-could-help-doctors-diagnose-treat-small-intestine-disorders-1028
    summary: Disorders of the small intestine are often difficult to diagnose and
      treat. More than 20 feet long, an inch in diameter, and located deep
      within the body, this organ is harder to access than other parts of the
      digestive tract, such as the colon or stomach.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202610/MIT-IntestineRobot-A1-Press.jpg?itok=i_z0q2qb
