  - title: AI searched 100 million possibilities and found a cheaper way to 3D-print
      a NASA rocket alloy
    url: https://www.sciencedaily.com/releases/2026/08/260827010504.htm
    summary: Researchers used AI to search through more than 100 million possible
      settings for 3D-printing a high-performance NASA alloy. After only 40
      experiments, the system identified six successful configurations,
      including one that worked at a record-low 500 watts. That could allow
      GRCop-42, currently difficult and expensive to print, to be made with much
      more widely available equipment.
    imageUrl: https://www.sciencedaily.com/images/1920/3d-printing-metal-parts-close.webp
    categories: []
    publishedAt: 2026-08-27T13:08:01.000Z
    source: ScienceDaily — Robotics
  - title: Scientists switch on a strange new form of magnetism in an ultrathin
      material
    url: https://www.sciencedaily.com/releases/2026/08/260826055454.htm
    summary: Scientists have found a surprising way to potentially switch on an
      unusual form of magnetism in ruthenium dioxide, a material that normally
      appears nonmagnetic. When the material was made into an ultrathin film
      only a few atomic layers thick and placed under strain, its electrons
      developed patterns consistent with altermagnetism, a recently proposed
      magnetic state with promising uses in advanced electronics.
    imageUrl: https://www.sciencedaily.com/images/1920/abstract-atomic-material-quantum-magnetism.webp
    categories: []
    publishedAt: 2026-08-27T09:23:20.000Z
    source: ScienceDaily — Computer Science
