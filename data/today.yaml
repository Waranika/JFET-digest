  - title: AI system can reconstruct aerodynamic shapes and predict their performance
    url: https://techxplore.com/news/2026-11-ai-reconstruct-aerodynamic.html
    summary: The efficiency of an aircraft wing or a wind turbine blade depends on
      how air flows around it. Finding an optimal shape involves testing
      numerous designs and can be a burdensome and time-consuming process. Now,
      researchers at Kyushu University have developed a new artificial
      intelligence (AI) system that can predict the aerodynamic performance of
      different shapes. The AI system may allow engineers more time to explore
      and compare designs more efficiently.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/an-ai-system-that-reco.jpg
    categories:
      - Engineering
    publishedAt: 2026-11-12T21:20:12.000Z
    source: TechXplore — Engineering
  - title: AI improves cosmic particle scans to locate hidden objects more
      accurately in simulations
    url: https://techxplore.com/news/2026-11-ai-cosmic-particle-scans-hidden.html
    summary: Researchers at the University of Tartu Institute of Computer Science
      are working with the Estonian technology company GScan to develop AI-based
      methods that use measurement data collected with the help of cosmic
      particles to locate objects more accurately. The technology is useful for
      assessing the condition of bridges and other large structures and
      identifying potential damage.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/ai-helps-university-of.jpg
    categories:
      - Computer Sciences
    publishedAt: 2026-11-12T20:00:24.000Z
