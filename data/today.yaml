  - title: File-notification systems leave Windows, Linux, Android and macOS
      vulnerable
    url: https://techxplore.com/news/2026-09-notification-windows-linux-android-macos.html
    summary: Researchers at the Institute of Information Security at Graz University
      of Technology (TU Graz) have uncovered security risks in the file
      notification systems of the widely used operating systems Windows, Linux,
      Android and macOS. Through side-channel attacks, attackers can track
      system-wide changes to files, keystrokes and visited websites, and spoof
      password prompts to intercept entries.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/file-notification-syst-2.jpg
    categories:
      - Computer Sciences
    publishedAt: 2026-09-28T16:00:01.000Z
