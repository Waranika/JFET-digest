  - title: Global fossil fuel emissions set to fall in 2026, but total CO2 keeps
      rising
    url: https://www.sciencedaily.com/releases/2026/11/261109205358.htm
    summary: Global fossil fuel emissions are projected to fall in 2026 as renewable
      energy and electric vehicles gain ground, but rising emissions from
      deforestation threaten to push total CO2 emissions to a new record.
      Scientists warn that the world's remaining carbon budget for limiting
      warming to 1.5°C could be exhausted in less than four years, even as a
      lasting decline in emissions appears increasingly within reach.
    imageUrl: https://www.sciencedaily.com/images/1920/carbon-dioxide-air-pollution-industrial-smokestack.webp
