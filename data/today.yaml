  - title: The promise and peril of using visual AI to study cities
    url: https://news.mit.edu/2026/studying-cities-using-visual-ai-fabio-duarte-martina-mazzarello-carlo-ratti-fan-zhang-book-0924
    summary: "A few months ago, researchers from the MIT Senseable City Lab
      published a study about pollution in New York City featuring some new
      methods. For instance: With machine learning, they identified the types of
      vehicles appearing in 331 traffic cameras in the city, and estimated the
      emissions coming from each automobile. Given enough cameras, these visual
      artificial intelligence techniques could monitor emissions with an
      unprecedented combination of precision and scale."
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202609/MIT-AI-City-01.jpg?itok=Llq61kUr
