  - title: Interstellar solar sails hit a bizarre problem at 75% of light speed
    url: https://www.sciencedaily.com/releases/2026/11/261120071305.htm
    summary: "Scientists have discovered a surprising obstacle to interstellar
      travel: at extreme speeds, the light propelling futuristic solar sails
      could actually begin slowing them down. Once a spacecraft reaches 75% of
      the speed of light, some scattered light starts producing drag,
      potentially complicating humanity’s plans to reach distant stars."
    imageUrl: https://www.sciencedaily.com/images/1920/diffractive-solar-sail.webp
    categories: []
    publishedAt: 2026-11-22T11:59:29.000Z
    source: ScienceDaily — Engineering
  - title: AI may not work like the human brain after all, scientists discover
    url: https://www.sciencedaily.com/releases/2026/11/261120075701.htm
    summary: AI may not think like the human brain after all, according to a
      striking new discovery that challenges how scientists understand
      artificial intelligence. Researchers found that even AI models that
      closely predict brain activity may rely on internal processes the brain
      doesn't use, raising important questions about their reliability in
      neuroscience research.
    imageUrl: https://www.sciencedaily.com/images/1920/human-vs-ai-brain-thinking-understanding.webp
    categories: []
    publishedAt: 2026-11-21T15:24:58.000Z
    source: ScienceDaily — Artificial Intelligence
