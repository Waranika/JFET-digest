  - title: New AI 'copilot' lets engineers guide structural designs as algorithms
      create them
    url: https://techxplore.com/news/2026-11-ai-copilot-algorithms.html
    summary: "The use of algorithms to design structures has led to new parts
      optimized for ultralight aircraft, high-bandwidth antennas and F1 racing
      cars. But the best algorithmic design techniques still require lots of
      computation and time: Users only see the final design after it's complete,
      after which they often must start the design process all over again to
      make changes. That process also makes it harder to trust that the final
      designs are structurally sound."
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/new-ai-copilot-helps-e.jpg
    categories:
      - Engineering
    publishedAt: 2026-11-13T17:00:01.000Z
