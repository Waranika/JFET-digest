  - title: Scientists smash oxygen nuclei to recreate matter from the Big Bang
    url: https://www.sciencedaily.com/releases/2026/10/261030002935.htm
    summary: Scientists have recreated a primordial state of matter from the dawn of
      the universe by colliding oxygen nuclei at nearly the speed of light. The
      surprising results show that this exotic substance can form in smaller,
      lower-energy collisions than previously demonstrated, challenging the
      known boundaries of early-universe physics.
    imageUrl: https://www.sciencedaily.com/images/1920/back-to-back-jets-produced-in-quark-gluon-plasma.webp
    categories: []
    publishedAt: 2026-10-31T02:09:38.000Z
    source: ScienceDaily — Engineering
  - title: MIT affiliates named 2026 Schmidt Sciences AI2050 Fellows
    url: https://news.mit.edu/2026/mit-affiliates-named-schmidt-sciences-ai2050-fellows-1030
    summary: Five MIT faculty members and two additional alumni were recently named
      to the 2026 cohort of AI2050 Fellows. The honor is announced annually by
      Schmidt Sciences, Eric and Wendy Schmidt’s philanthropic initiative that
      aims to accelerate scientific innovation.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202610/mit-eecs-Schmidt-AI-2050.jpg?itok=tKYYjIR3
