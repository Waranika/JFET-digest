  - title: People are taking an unapproved weight-loss drug. AI found something
      surprising
    url: https://www.sciencedaily.com/releases/2026/10/261020085018.htm
    summary: Researchers analyzing nearly 150,000 Reddit posts uncovered unexpected
      symptom reports linked by users to unapproved versions of retatrutide,
      including increased appetite, sleep disturbances, and elevated heart
      rates. The findings differ from clinical trial results and highlight how
      AI could help identify potential drug safety signals that warrant further
      investigation.
    imageUrl: https://www.sciencedaily.com/images/1920/happy-young-woman-with-pink-donuts.webp
    categories: []
    publishedAt: 2026-10-22T02:37:01.000Z
