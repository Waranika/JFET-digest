    publishedAt: 2026-08-10T18:01:25.000Z
    source: IEEE Spectrum — Robotics
  - title: Electronic skin enables tunable touch and proximity sensing for robots
      and prosthetics
    url: https://techxplore.com/news/2026-08-electronic-skin-enables-tunable-proximity.html
    summary: Recent advances in miniaturized and portable electronics, particularly
      wearable and flexible devices, have increased the demand for self-powered
      sensing technologies. Among these, triboelectric nanogenerators (TENGs)
      have received considerable attention for developing highly sensitive
      tactile sensors.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/hanyang-university-eri-3.jpg
    categories:
      - Robotics
