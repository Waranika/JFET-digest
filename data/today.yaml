  - title: MIT spinout makes surgical stitching more like applying a sticky note
    url: https://news.mit.edu/2026/sanaheal-makes-surgical-stitching-more-like-applying-sticky-note-1020
    summary: Dozens of surgical procedures require doctors to connect two pieces of
      tissue together in a delicate stitching process. It happens in triple
      heart bypass, C-sections, and surgeries to repair hernias and tendons.
      Today, those procedures are mostly done by surgeon-controlled robots or by
      hand, and the margin for error is small. Even small errors in suturing or
      stapling can lead to leaks with devastating consequences to patients.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202610/MIT_SanaHeal-01-press.jpg?itok=p8FULfCM
    categories: []
    publishedAt: 2026-10-20T04:00:00.000Z
    source: MIT Robotics
