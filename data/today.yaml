  - title: Hypersonic projectiles turn ultra-hard diamond composite into
      shock-absorbing graphite
    url: https://techxplore.com/news/2026-11-hypersonic-projectiles-ultra-hard-diamond.html
    summary: '"Diamonds are forever." Or so the saying goes. Texas A&M University
      College of Engineering and Rice University researchers put that claim to
      the ultimate test. They forged a diamond composite, then marched it
      directly into the line of fire, blasting it with aluminum projectiles
      traveling at more than eight times the speed of sound.'
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/forging-diamonds-firin-2.jpg
    categories:
      - Engineering
    publishedAt: 2026-11-04T10:40:02.000Z
    source: TechXplore — Engineering
  - title: Chernobyl’s Dogs May Be Evolving, but Scientists Don’t Know Why
    url: https://www.wired.com/story/chernobyls-dogs-may-be-evolving-but-scientists-dont-know-why/
    summary: A new study found evidence of natural selection in the dogs of
      Chernobyl, but it’s still unclear what drove these genetic differences and
      what evolutionary advantages they may provide.
