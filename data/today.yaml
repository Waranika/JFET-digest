  - title: Why Does Voice AI Still Struggle With Kenyans’ Speech?
    url: https://spectrum.ieee.org/swahili-speech-recognition
    summary: When people read prepared text aloud, AI can transcribe Swahili with
      remarkably few errors, and Swahili speech recognition looks close to
      solved. A March 2026 preprint by a team including a Harvard University
      researcher reports a 3.24 percent word error rate on recordings from
      Mozilla’s Common Voice collection of volunteer-recorded speech.
    imageUrl: https://spectrum.ieee.org/media-library/three-college-students-posing-together-in-front-of-a-whiteboard-covered-in-writing-from-various-sheng-dialects.jpg?id=68751313&width=2000&height=1500&coordinates=402%2C0%2C403%2C0
    categories:
