  - title: 3D-printable material can heal the body, build better robots and recover
      critical minerals
    url: https://techxplore.com/news/2026-07-3d-printable-material-body-robots.html
    summary: A new type of 3D-printable material developed by researchers at The
      University of Texas at Austin mimics human tissue's ability to sort and
      filter, allowing certain molecules to pass through while keeping others
      out. This broad functionality means the material can be used in a variety
      of applications across medicine, water and robotics.
