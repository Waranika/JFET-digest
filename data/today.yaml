  - title: A 0.42-nanometer breakthrough could push transistors beyond silicon
    url: https://www.sciencedaily.com/releases/2026/08/260808234943.htm
    summary: Atomically thin semiconductors could enable dramatically smaller and
      more efficient chips, but a stubborn problem at the boundary between
      materials has limited their performance. Researchers have now engineered
      that atomic interface to protect electron flow while still allowing
      extremely thin insulating layers. The resulting transistors delivered an
      unusually strong combination of electrical control and performance.
    imageUrl: https://www.sciencedaily.com/images/1920/epitaxial-interface-engineering-enables-high-transconductance-2d-transistors.webp
    categories: []
    publishedAt: 2026-08-09T06:05:43.000Z
    source: ScienceDaily — Computer Science
  - title: New fuel cell breakthrough could help power energy-hungry data centers
    url: https://www.sciencedaily.com/releases/2026/08/260807035140.htm
    summary: A new nanostructured carbon design lets fuel-cell catalysts use tiny
      amounts of platinum while remaining remarkably stable and efficient. The
      breakthrough could help hydrogen fuel cells become a more practical way to
      power data centers, vehicles, and other energy-intensive technologies.
    imageUrl: https://www.sciencedaily.com/images/1920/electricity-lightning-data-center-power.webp
    categories: []
    publishedAt: 2026-08-08T14:09:02.000Z
    source: ScienceDaily — Engineering
  - title: AI Safety Regulations in the U.S. Could Give Hackers an Edge
    url: https://spectrum.ieee.org/hugging-face-openai-cyberattack
    summary: On 11 July, Hugging Face was subjected to an intense cyberattack from a
      then-unknown actor. The speed and coordination of the attack on the
      company that hosts and supports popular AI developer resources led Hugging
      Face’s security team to conclude it was the work of an AI agent.
    imageUrl: https://spectrum.ieee.org/media-library/illustration-of-hugging-faces-smiley-face-logo-holding-up-scales-of-justice-against-a-background-of-binary-code.jpg?id=67583759&width=1245&height=700&coordinates=0%2C469%2C0%2C469
    categories:
