  - title: Porous 3D-printed feet cut quadruped robot power use
    url: https://techxplore.com/news/2026-07-porous-3d-feet-quadruped-robot.html
    summary: Quadruped robots, which walk on four legs, are increasingly used for
      tasks such as inspection, transportation and search-and-rescue operations.
      However, their repeated leg movements consume far more energy than the
      rolling motion of wheeled robots, making it challenging to improve energy
      efficiency.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/seoul-national-univers-1.jpg
