  - title: How OpenAI Used Its Own LLMs to Design Its Jalapeño Chip
    url: https://spectrum.ieee.org/llms-for-chip-design
    summary: On 25 August, OpenAI fully unveiled Jalapeño, the company’s debut AI
      accelerator chip. Jalapeño delivers up to 13.4 petaflops of 4-bit compute
      and accesses 232 gigabytes of the most advanced memory available, linking
      to it at a blazing 15.4 terabytes per second. Benchmarks cited by OpenAI
      show that Jalapeño can reduce end-to-end latency (the time between prompt
      to last token) by up to 3.6x when compared to Nvidia’s GB300—a chip the
      company currently relies on—and do so while consuming less power.
    imageUrl: https://spectrum.ieee.org/media-library/close-up-of-a-computer-processor-consisting-of-several-pieces-of-silicon.jpg?id=67770467&width=1245&height=700&coordinates=0%2C187%2C0%2C188
    categories:
      - Openai
      - Llms
      - Chip-design
    publishedAt: 2026-09-14T14:06:31.000Z
    source: IEEE Spectrum — Computing & Chips
