  - title: Outdoor 3D tracking technology uses a drone's flight path as a 'moving
      ruler'
    url: https://techxplore.com/news/2026-11-outdoor-3d-tracking-technology-drone.html
    summary: The secret behind the lifelike movements of the characters in the film
      "Avatar" was motion capture, a technology that records movement in three
      dimensions by attaching markers to actors' bodies and filming them with
      multiple cameras inside a studio. However, bringing such precise
      measurement into wide outdoor spaces such as sports fields has never been
      easy.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/outdoor-3d-tracking-te.jpg
    categories:
      - Artificial Intelligence
    publishedAt: 2026-11-20T16:00:28.000Z
    source: TechXplore — Robotics
  - title: I Don’t Trust Visual Recordings Anymore. But One Day I Will Again
    url: https://spectrum.ieee.org/fighting-back-against-deep-fakes
    summary: In March of this year, a flurry of emails and text messages from a half
      dozen reporters around the world disrupted my quiet Saturday morning. An
      Iranian news agency had aired a week-old video of what appeared to be a
      U.S.-made Tomahawk missile hitting a school. News reports claimed that the
      strike killed more than 175 people, most of them children. The U.S.
      president and military denied responsibility. In the age of generative AI
      and all things deepfake, everyone—including me—was skeptical of the
      video’s authenticity.
    imageUrl: https://spectrum.ieee.org/media-library/photo-collage-of-a-mans-face-featuring-glitched-distortions-and-abstract-shapes.jpg?id=68721975&width=1245&height=700&coordinates=0%2C469%2C0%2C470
    categories:
      - Deepfakes
      - Generative-ai
      - Digital-forensics
      - Content-credentials
    publishedAt: 2026-11-20T14:00:03.000Z
    source: IEEE Spectrum — Computing & Chips
  - title: CERN scientists finally find evidence of a particle decay so rare it took
      40 years to detect
    url: https://www.sciencedaily.com/releases/2026/11/261119194530.htm
    summary: Scientists at CERN have found the first evidence of an incredibly rare
      particle decay after more than 40 years of searching, detecting a process
      expected to occur just once in every 10 billion beauty particles. The
      breakthrough could help physicists explore a mysterious microscopic realm
      where unknown particles and forces may be hiding.
    imageUrl: https://www.sciencedaily.com/images/1920/high-energy-atomic-particle-physics.webp
    categories: []
    publishedAt: 2026-11-20T12:23:23.000Z
    source: ScienceDaily — Engineering
  - title: Meet Shepherd, the Meta-Agent Keeping Rogue AI In Check
    url: https://spectrum.ieee.org/ai-agent-manager
    summary: AI agents are running amok on the internet, armed with commands to
      accomplish certain tasks but often acting in undesirable or unexpected
      ways. These rogue incidents run the gamut from deleting an entire email
      inbox to hacking websites and even launching cyberattacks.
    imageUrl: https://spectrum.ieee.org/media-library/illustration-of-an-ai-agent-supervising-and-designating-tasks-to-smaller-ai-agents.jpg?id=68511562&width=1200&height=400&coordinates=0%2C729%2C0%2C730
    categories:
      - Agentic-ai
      - Alignment
      - Software-engineering
      - Algorithmic-management
    publishedAt: 2026-11-19T15:00:03.000Z
    source: IEEE Spectrum — AI
  - title: "This featherweight, flying robot carries its own sensors and computers "
    url: https://news.mit.edu/2026/featherweight-flying-robot-carries-its-own-sensors-and-computers-1118
    summary: Over the past decade, MIT researchers have developed aerial microrobots
      with bumblebee-like speed, agility, and durability, for tasks like
      precision agriculture or search-and-rescue. But these featherweight
      microrobots couldn’t carry the electronics needed for navigation, forcing
      them to remain connected to a motion-capture system in the lab.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202611/MIT-Onboard-Microbot-A1-press.jpg?itok=-TluzTJd
    categories: []
    publishedAt: 2026-11-18T19:00:00.000Z
    source: MIT Robotics
  - title: Scientists tracked kids for 8 years. What they found about screen time
      was surprising
    url: https://www.sciencedaily.com/releases/2026/11/261116014725.htm
    summary: A surprising Finnish study found that children who spent more time
      using screens tended to have better cognitive processing abilities as
      teenagers, challenging the assumption that screen time is always harmful.
      Researchers suggest that what children do on screens may matter more than
      how much time they spend using them.
    imageUrl: https://www.sciencedaily.com/images/1920/cute-boy-staring-at-cell-phone-screen.webp
    categories: []
    publishedAt: 2026-11-17T12:03:58.000Z
    source: ScienceDaily — Computer Science
  - title: AI discovers a hidden heart signal that could predict sudden death
    url: https://www.sciencedaily.com/releases/2026/11/261112230456.htm
    summary: Scientists have uncovered a hidden warning sign in routine heart scans
      that could predict sudden cardiac death before it strikes. The AI-powered
      discovery outperformed conventional screening methods, potentially
      revealing thousands of people at risk of a fatal heart malfunction that
      doctors might otherwise miss.
    imageUrl: https://www.sciencedaily.com/images/1920/cardiology-heart-attack-disease-prevention.webp
    categories: []
    publishedAt: 2026-11-15T01:05:10.000Z
    source: ScienceDaily — Robotics
  - title: Build a Hidden Lock With a Magnetic Imager
    url: https://spectrum.ieee.org/magnetic
    summary: Like many a nerd, I have a certain fascination with locks. This
      originates in reading the memoir Surely You’re Joking, Mr. Feynman as a
      teenager, in which Richard Feynman recounts picking locks and cracking
      combinations while at his day job working on the Manhattan Project at Los
      Alamos. I currently have a couple of locksport pick sets and training
      locks that I purchased at hacker conferences over the years (although I’m
      still terrible at it), and I delight in the YouTube exploits of folks like
      the LockPickingLawyer.
    imageUrl: https://spectrum.ieee.org/media-library/a-medium-sized-box-with-an-open-lid-inside-is-a-lock-mechanism-a-battery-pack-and-some-circuit-boards.png?id=68493268&width=1200&height=800&coordinates=0%2C289%2C0%2C290
    categories:
