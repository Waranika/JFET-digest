  - title: Blockchain-inspired DNA storage codec recovers data from heavily damaged
      sequences
    url: https://techxplore.com/news/2026-09-blockchain-dna-storage-codec-recovers.html
    summary: A research team at the Faculty of Engineering at The University of Hong
      Kong (HKU), led by professor Ruibang Luo of the School of Computing and
      Data Science and professor Can Li of the Department of Electrical and
      Computer Engineering, has developed Gungnir, a blockchain-inspired DNA
      data storage codec. The framework improves digital information recovery
      from severely damaged DNA sequences, potentially extending the practical
      lifespan of DNA data archives from less than a decade to centuries. The
      paper is published in the journal Nature Communications.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/hku-researchers-develo.jpg
    categories:
      - Computer Sciences
    publishedAt: 2026-09-23T19:40:01.000Z
