  - title: Lifesaving Lincoln Laboratory device wins 2026 Excellence in Technology
      Transfer Award
    url: https://news.mit.edu/2026/lifesaving-lincoln-laboratory-technology-wins-tech-transfer-award-0911
    summary: The Federal Laboratory Consortium (FLC) selected AI-GUIDE, a medical
      device developed by MIT Lincoln Laboratory and Massachusetts General
      Hospital (MGH), for its 2026 Excellence in Technology Transfer Award. This
      award recognizes federal laboratories and collaborators who have
      accomplished outstanding work in the process of transferring technology.
      With funding from the U.S. Army's Combat Casualty Care Research Program
      (CCC), Lincoln Laboratory and MGH developed AI-GUIDE and are in the
      process of transferring the prototype to the startup company AutonomUS
      Medical Technologies, Inc.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202608/mit-lincoln-AI-GUIDE.jpg?itok=2Fxb1RR9
    categories: []
    publishedAt: 2026-09-11T13:45:00.000Z
    source: MIT Artificial Intelligence
