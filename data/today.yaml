  - title: For the first time, scientists watch sound jump between quantum states
    url: https://www.sciencedaily.com/releases/2026/09/260921081054.htm
    summary: Stanford researchers have recorded the first real-time quantum jumps of
      sound, watching single phonons abruptly vanish from one energy state to
      another. The breakthrough could open new paths for quantum computing,
      error correction, highly sensitive biological sensors, and next-generation
      sound-based devices.
    imageUrl: https://www.sciencedaily.com/images/1920/quantum-jumps-in-sound.webp
    categories: []
    publishedAt: 2026-09-22T13:17:20.000Z
    source: ScienceDaily — Computer Science
  - title: MIT’s tiny flying robot gets 450% faster with AI
    url: https://www.sciencedaily.com/releases/2026/09/260921081114.htm
    summary: A new AI control system lets MIT’s tiny flying robot move with
      insect-like agility, boosting its speed by about 450 percent and allowing
      it to pull off 10 somersaults in 11 seconds. The technology could
      eventually enable miniature robots to search earthquake rubble and
      navigate dangerous spaces that conventional drones cannot reach.
    imageUrl: https://www.sciencedaily.com/images/1920/mit-flying-microrobot.webp
    categories: []
