  - title: One of China’s Most Powerful AI Models Has Also Escaped Containment
    url: https://www.wired.com/story/moonshot-kimi-k3-ai-model-escape-sandbox/
    summary: Security researchers say that Kimi K3, an open-weight model from China,
      wandered off to the internet in an attempt to cheat on a test it was
      given.
    imageUrl: https://media.wired.com/photos/6a749a84077eac6832213fdf/191:100/w_1280,c_limit/BadKimi.jpg
    categories:
      - Business
      - Business / Artificial Intelligence
    publishedAt: 2026-08-07T01:16:55.000Z
    source: WIRED (AI)
  - title: Hardware-aware framework accelerates large language models without
      additional training
    url: https://techxplore.com/news/2026-08-hardware-aware-framework-large-language.html
    summary: As large language models (LLMs) become increasingly embedded in
      chatbots, virtual assistants, translation services, coding tools and other
      AI-powered applications, delivering responses quickly and efficiently has
      become a growing challenge. Because these models generate text one token
      at a time, inference can be slow and computationally expensive,
      particularly for larger models. While speculative decoding has emerged as
      a promising approach to accelerate inference, many existing methods either
      require additional model training or struggle to perform consistently
      across different hardware platforms.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/training-free-framewor-1.jpg
    categories:
      - Hardware
    publishedAt: 2026-08-06T21:40:06.000Z
    source: TechXplore — AI & Machine Learning
  - title: AI Safety Regulations in the U.S. Could Give Hackers an Edge
    url: https://spectrum.ieee.org/hugging-face-openai-cyberattack
    summary: On 11 July, Hugging Face was subjected to an intense cyberattack from a
      then-unknown actor. The speed and coordination of the attack on the
      company that hosts and supports popular AI developer resources led Hugging
      Face’s security team to conclude it was the work of an AI agent.
    imageUrl: https://spectrum.ieee.org/media-library/illustration-of-hugging-faces-smiley-face-logo-holding-up-scales-of-justice-against-a-background-of-binary-code.jpg?id=67583759&width=1200&height=800&coordinates=0%2C208%2C0%2C209
    categories:
      - Agentic-ai
      - Openai
      - Huggingface
      - Ai-safety
    publishedAt: 2026-08-06T19:25:39.000Z
    source: IEEE Spectrum — AI
  - title: "Generative AI: Modeling a proper cuppa from a proper pot"
    url: https://techxplore.com/news/2026-08-generative-ai-proper-cuppa-pot.html
    summary: "The Yixing Zisha teapot sits neatly at the intersection of art,
      engineering and heritage. As such, it makes for an intriguing test case
      for a technology increasingly taking on creative tasks across almost every
      field of human endeavor: artificial intelligence, or AI. Research
      published in the International Journal of Systems, Control and
      Communications describes a computational system that can help AI generate
      new teapot designs without losing the cultural characteristics that make
      the craft distinctive."
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2020/blacktea.jpg
    categories:
      - Engineering
    publishedAt: 2026-08-06T18:20:09.000Z
    source: TechXplore — Engineering
  - title: DeepMind Says Its AI Can Predict Hurricanes Earlier Than Everyone Else
    url: https://www.wired.com/story/deepmind-ai-model-can-predict-hurricanes-earlier/
    summary: Its WeatherNext model, which will be open-sourced, can accurately
      predict a storm’s track and intensity using lower-resolution weather data.
      Researchers don’t yet fully understand how it does this.
    imageUrl: https://media.wired.com/photos/6a748489077eac6832213fd9/191:100/w_1280,c_limit/AICyclone.jpg
    categories:
      - Science
      - Science / Environment
    publishedAt: 2026-08-06T16:23:04.000Z
    source: WIRED science
  - title: "Optimizing software: Computing professor's 'egg' downsizes programs to
      make them more nimble"
    url: https://techxplore.com/news/2026-08-optimizing-software-professor-egg-downsizes.html
    summary: Many software tools, including compilers, optimizers and synthesizers,
      have a common task at their core. They must transform long, complicated
      programs into simplified equivalents. These scaled-down programs run
      faster and on a wider range of hardware but must deliver the same results
      as their original versions.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/optimizing-software-co-1.jpg
    categories:
      - Software
    publishedAt: 2026-08-06T15:40:24.000Z
    source: TechXplore — Computer Science
  - title: Cell-inspired nanoreactor turns sunlight into hydrogen peroxide
    url: https://www.sciencedaily.com/releases/2026/08/260804034642.htm
    summary: A new hollow nanoreactor mimics living cells to make hydrogen peroxide
      more efficiently using visible light. Its light-trapping cavity and
      proton-shuttling shell could open new possibilities for cleaner chemical
      manufacturing and artificial photosynthesis.
    imageUrl: https://www.sciencedaily.com/images/1920/nanoreactor-mimics-living-cells-for-enhanced-artificial-photosynthesis.webp
    categories: []
    publishedAt: 2026-08-06T12:03:02.000Z
    source: ScienceDaily — Engineering
  - title: A new way to watch heat move through electronics
    url: https://news.mit.edu/2026/new-way-watch-heat-move-through-electronics-0806
    summary: The same overheating problem that happens to our laptops also plagues
      computer servers and data centers around the world — and heat management
      is only getting harder as computer chips get more compact and powerful.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202608/MIT-HiddenHeat-01-press.jpg?itok=8Ts2ykU-
    categories: []
    publishedAt: 2026-08-06T04:00:00.000Z
    source: MIT Engineering
  - title: Claude Fable 5 AI finds a tiny formula that topples an 87-year-old math
      conjecture
    url: https://www.sciencedaily.com/releases/2026/08/260804034634.htm
    summary: A mathematician working at Anthropic says he used the AI model Claude
      Fable 5 to uncover a remarkably simple counterexample to the Jacobian
      conjecture, a famous problem that has resisted mathematicians for more
      than a century. The result shows that the conjecture is false in three
      dimensions and above, although the original two-dimensional version
      remains unsolved.
    imageUrl: https://www.sciencedaily.com/images/1920/humanoid-ai-robot-hologram-screen-solving-physics-math-problems.webp
    categories: []
    publishedAt: 2026-08-06T02:02:49.000Z
    source: ScienceDaily — Robotics
  - title: "Personalized physical therapy: Stroke rehabilitation powered by AI"
    url: https://news.mit.edu/2026/personalized-physical-therapy-stroke-rehabilitation-powered-by-ai-0805
    summary: Stroke is one of the leading causes of death and disability worldwide,
      affecting 15 million people each year and leaving 5 million with long-term
      impairments. There’s also a growing shortage of physical therapists,
      making it harder for patients to access consistent, high-quality care.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202508/mit-Lachner-Hogan-Lab.jpg?itok=uGQCI-8t
    categories: []
    publishedAt: 2026-08-05T18:15:00.000Z
    source: MIT Robotics
  - title: Human-aware robots adapt to partners, reducing back strain during team
      lifting
    url: https://techxplore.com/news/2026-08-human-aware-robots-partners-strain.html
    summary: When people work in pairs or teams, they can often solve a wider range
      of problems, completing some tasks faster and more efficiently than they
      would alone. To assist users similarly to how other humans would, robots
      should be able to rapidly interpret human behaviors and commands, using
      their predictions to plan and precisely execute helpful actions.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/an-approach-to-designi.jpg
    categories:
      - Robotics
    publishedAt: 2026-08-05T12:00:02.000Z
    source: TechXplore — Robotics
  - title: "Solving the solvent problem  "
    url: https://news.mit.edu/2026/solving-solvent-problem-sodium-metal-batteries-0804
    summary: Lithium-ion batteries are the leading choice in today’s electric
      vehicle and battery energy storage system industries, but they contain a
      number of critical minerals — including lithium, cobalt, nickel, and
      graphite — that are considered essential for economic and national
      security reasons, and therefore vulnerable to supply chain disruptions. As
      renewable energy, electrified infrastructure, and high-power digital
      technologies continue to grow, there is an increasing need for energy
      storage systems that are low-cost, resource-abundant, and capable of fast
      charging and discharging.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202607/MIT-nse-solvent-problem.jpg?itok=rXwEm3ti
    categories: []
    publishedAt: 2026-08-04T18:50:00.000Z
    source: MIT Artificial Intelligence
