  - title: AI helps identify drilling regimes with a projected potential increase in
      drilling speed of up to 68%
    url: https://techxplore.com/news/2026-10-ai-drilling-regimes-potential.html
    summary: Assistant professor Shadfar Davoodi at the Skoltech AI Center has
      developed an approach for optimizing drilling in heterogeneous carbonate
      reservoirs that simultaneously predicts process characteristics, explains
      the influence of individual parameters and identifies the most efficient
      operating regimes. For one of the studied wells, the model estimated a
      potential increase in the rate of penetration of up to 68.4%.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/ai-helps-identify-dril.jpg
    categories:
      - Engineering
    publishedAt: 2026-10-09T00:40:06.000Z
    source: TechXplore — Engineering
  - title: "3 Questions: What is the best path forward for AI in academia?"
    url: https://news.mit.edu/2026/3-questions-what-best-path-forward-ai-academia-0925
    summary: With artificial intelligence capabilities continuing to expand,
      universities now face complex, urgent questions about how to navigate
      increasing challenges, as well as new opportunities. Much attention is now
      directed toward this, including an MIT report on AI and education
      published this summer.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202610/ai-and-academia-00.jpg?itok=A5hPBHGn
