  - title: The uranium cubes that exposed Nazi Germany’s nuclear failure
    url: https://www.sciencedaily.com/releases/2026/10/261015073218.htm
    summary: Scientists investigating Nazi Germany's secret nuclear program have
      uncovered evidence that its final experimental reactor was nowhere near as
      close to working as previously claimed. Analysis of surviving uranium
      cubes and wartime documents reveals that Germany lacked the enormous
      quantities of uranium and heavy water needed to make its reactor
      operational.
    imageUrl: https://www.sciencedaily.com/images/1920/natural-uranium-cube.webp
    categories: []
    publishedAt: 2026-10-16T12:32:52.000Z
    source: ScienceDaily — Engineering
