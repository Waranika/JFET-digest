  - title: Streamlining metal parts production to revitalize American industry
    url: https://news.mit.edu/2026/streamlining-metal-parts-production-revitalize-american-industry-fabri-1110
    summary: The United States used to be the world leader in metal casting, a
      process where liquid hot metal is poured into a mold to solidify into a
      desired shape. But more than 70 percent of American metal casting
      facilities have closed since the industry’s peak in the 1950s. Today,
      China and India dominate global metal casting production, which is
      critical for making the components of jet engines, nuclear and gas
      turbines, medical devices, and more.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202611/MIT-Fabri-01-press.jpg?itok=vLqRlOFF
    categories: []
