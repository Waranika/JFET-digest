  - title: Extending AI architectures to address continuous scientific problems
    url: https://techxplore.com/news/2026-08-ai-architectures-scientific-problems.html
    summary: "Artificial intelligence is proving to be transformative in its ability
      to work with language and images. Now, with a growing push to apply AI to
      scientific discovery, Caltech's Anima Anandkumar says there is a crucial
      ingredient missing from most AI models: the ability to understand the
      physical world. Take, for example, weather models, says Anandkumar,
      Caltech's Bren Professor of Computing and Mathematical Sciences. If you
      want an AI model to predict weather, it must understand chaotic physical
      systems, like how the atmosphere changes around the planet and over time."
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/extending-ai-architect-1.jpg
    categories:
      - Computer Sciences
    publishedAt: 2026-08-12T20:00:01.000Z
    source: TechXplore — Computer Science
  - title: Self-repairing coating promises to make gas turbines more reliable and
      longer lasting
    url: https://techxplore.com/news/2026-08-coating-gas-turbines-reliable-longer.html
    summary: Gas turbine engines, like those powering passenger planes, operate
      under extreme conditions during everyday use. These engines regularly
      reach temperatures well over 800°C (1,470°F), which creates challenges for
      long-term durability and efficiency.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/gas-turbine-engines.jpg
    categories:
      - Engineering
    publishedAt: 2026-08-12T17:20:06.000Z
    source: TechXplore — Engineering
  - title: Butterfly-inspired ceramic microscrolls unroll with magnets to power tiny
      robots
    url: https://techxplore.com/news/2026-08-butterfly-ceramic-microscrolls-unroll-magnets.html
    summary: Researchers at the University of Stuttgart and the Max Planck Institute
      for Solid State Research have developed tiny rolls that can be unrolled
      and rolled up in a controlled manner using a magnet. The model for this
      was the proboscis of butterflies. These smart materials enable the
      development of more efficient drive technologies for micro- and soft
      robotics, a field of research of great economic importance. The results
      have been published in the journal Advanced Materials.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/inspired-by-butterflie.jpg
    categories:
      - Robotics
    publishedAt: 2026-08-12T15:20:07.000Z
    source: TechXplore — Robotics
