  - title: Long AI conversations reveal misinformation vulnerabilities across seven
      leading chatbots
    url: https://techxplore.com/news/2026-09-ai-conversations-reveal-misinformation-vulnerabilities.html
    summary: "The results are in: Which AI model is the most fallible? Persuadable?
      Correctible? University of Arizona researchers assessed seven different
      generative AI large language models, or LLMs, for these three qualities
      during lengthy conversations. Their work, published in Nature's Scientific
      Reports, reveals intrinsic limitations that might go undetected during
      one-off interactions."
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/chatbots.jpg
