  - title: Is Shipyard Welding the Right First Job for Humanoid Robots?
    url: https://spectrum.ieee.org/persona-ai-humanoid-robot-welding
    summary: "Humanoids desperately need to stop making YouTube videos and get a job
      already, and Persona AI is one of the few humanoid companies which seems
      to be entirely focused on making that happen. Persona’s approach has been
      to carefully select a job that is economically viable for robots right
      now, and they’ve found one that was also the job of one of the very first
      industrial robots ever sold: welding."
    imageUrl: https://spectrum.ieee.org/media-library/two-men-supervise-a-humanoid-robot-as-it-completes-a-welding-task-in-an-industrial-warehouse.jpg?id=67626093&width=1245&height=700&coordinates=0%2C187%2C0%2C188
    categories:
      - Humanoid-robots
      - Robotics
      - Industrial-robots
    publishedAt: 2026-08-17T15:33:42.000Z
    source: IEEE Spectrum — Robotics
  - title: From AI Copilots to Agent Swarms
    url: https://spectrum.ieee.org/amd-agent-swarms
    summary: The impact of AI on software development has been both profound and
      ever-evolving. Last year, I wrote about AMD’s plans to use AI not just for
      generating new lines of code, but also for other steps in the software
      development lifecycle (SDLC), such as triaging problems, debugging code,
      and testing the software. At the time, we were hoping for a 25 percent
      productivity boost from AI use over the course of two or three years.
    imageUrl: https://spectrum.ieee.org/media-library/colorful-3d-blocks-piled-behind-glass-panels-displaying-white-code-snippets.jpg?id=67609515&width=1245&height=700&coordinates=0%2C187%2C0%2C188
    categories:
      - Agentic-ai
      - Software-engineering
      - Amd
      - Large-language-models
    publishedAt: 2026-08-17T14:00:01.000Z
    source: IEEE Spectrum — AI
  - title: Caltech breakthrough brings fiber-optic performance to silicon chips
    url: https://www.sciencedaily.com/releases/2026/08/260814235905.htm
    summary: Caltech scientists have created ultra-low-loss optical pathways on
      silicon chips that approach the efficiency of fiber optics and
      dramatically outperform existing technology at visible wavelengths. The
      breakthrough could unlock more powerful lasers, miniature atomic sensors
      and clocks, quantum systems, and more energy-efficient data centers.
    imageUrl: https://www.sciencedaily.com/images/1920/ultralow-loss-optical-fiber-performance-photonic-chips.webp
    categories: []
    publishedAt: 2026-08-17T12:30:41.000Z
    source: ScienceDaily — Engineering
  - title: Scientists turn DNA into a memory device that uses 100x less power
    url: https://www.sciencedaily.com/releases/2026/08/260816044853.htm
    summary: Researchers combined synthetic DNA with a semiconductor to create an
      ultra-low-power memory device capable of storing and processing
      information in the same place. The bio-hybrid technology could eventually
      help make AI systems and next-generation computers far more energy
      efficient.
    imageUrl: https://www.sciencedaily.com/images/1920/dna-research-genetics-technology.webp
    categories: []
    publishedAt: 2026-08-17T08:06:45.000Z
    source: ScienceDaily — Robotics
