  - title: "One AI model, trillions of variants: Breaking mass attacks on voice
      assistants"
    url: https://techxplore.com/news/2026-10-ai-trillions-variants-mass-voice.html
    summary: Imagine sitting in your home, listening to what you think is a
      run-of-the-mill advertisement or perhaps a piece of music you enjoy. But
      while you hum along, that audio file is sending a secret, malicious audio
      message—imperceptible to human ears—telling your home assistant to unlock
      your door or maybe transfer money from your bank account.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/voice-assistants.jpg
    categories:
      - Security
    publishedAt: 2026-10-17T12:00:13.000Z
    source: TechXplore — AI & Machine Learning
  - title: Team develops embodied robotic arm 'EmArm' with human-like touch sensing
    url: https://techxplore.com/news/2026-10-team-embodied-robotic-arm-emarm.html
    summary: A research team at The Hong Kong University of Science and Technology
      (HKUST) has developed an Embodied Sensorimotor Robotic Arm (EmArm) capable
      of whole-arm tactile sensing and adaptive manipulation. By embedding a
      soft optical tactile skin directly into a robotic skeleton and integrating
      it with a real-time decision-making algorithm, EmArm can perceive and
      analyze contact information across its upper and lower arms, enabling
      human-like tactile perception and adaptive object manipulation. The system
      can also distinguish between different touch interactions, such as
      tickling and patting, respond in real time and avoid obstacles through
      tactile feedback, opening new possibilities for the development of
      embodied intelligent robots.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/team-develops-embodied.jpg
    categories:
      - Robotics
    publishedAt: 2026-10-17T11:00:13.000Z
    source: TechXplore — Engineering
