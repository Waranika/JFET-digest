  - title: The AI Inference Revolution Is Here
    url: https://spectrum.ieee.org/inference-hardware-revolution
    summary: "Since about 2020, AI has largely focused on training bigger and better
      models. Large language models (LLMs) ballooned from millions of parameters
      to trillions. This proved effective: The largest version of OpenAI’s
      GPT-3, released in 2020, correctly answered just 43.9 percent of questions
      on a popular knowledge-and-reasoning benchmark. Just four years later,
      GPT-4o reached a score of 88.7 percent on the same exam, effectively
      matching those of human experts."
    imageUrl: https://spectrum.ieee.org/media-library/silhouetted-hand-holding-a-glowing-computer-chip-against-a-blue-background.jpg?id=67740879&width=1200&height=800&coordinates=0%2C666%2C0%2C667
    categories:
      - Large-language-models
      - Ai-hardware
      - Memory
    publishedAt: 2026-09-15T13:00:05.000Z
    source: IEEE Spectrum — Computing & Chips
  - title: This design software reimagines everyday objects as self-aware devices
    url: https://techxplore.com/news/2026-09-software-reimagines-everyday-aware-devices.html
    summary: "As a child, you likely saw a few Disney movies depicting inanimate
      objects, such as clocks, cups and toys, as interactive companions to
      humans—an act of pure magic, seemingly. But scientists at MIT's Computer
      Science and Artificial Intelligence Laboratory (CSAIL) are now doing
      something similar: transforming stationary items into self-aware tools
      that perceive and respond to human motion to complete a task."
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/this-design-software-r.jpg
    categories:
      - Software
    publishedAt: 2026-09-14T16:00:07.000Z
    source: TechXplore — Robotics
  - title: Responsible AI for Higher Education
    url: https://webinars.on24.com/wileyevents/ResponsibleAI
    summary: This interactive webinar will introduce the different types of AI,
      address the concerns with AI, share how we IBM are approaching Responsible
      AI, and offer guidance to students about what they can do - as
      individuals, and members of their IEEE chapters. Participants will also
      have the opportunity to to apply the Responsible AI approach to a
      particular use case - IBM Bob, a software development life cycle agent,
