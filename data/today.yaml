  - title: The U.S. Nuclear Plant Fleet Is Leaning Into AI
    url: https://spectrum.ieee.org/ai-assistants-nuclear-power-plant
    summary: If there is any place that would be off-limits to AI, the control room
      of a nuclear power plant certainly sounds like one. The nuclear industry
      is historically cautious and risk averse—understandable given the possible
      catastrophic consequences of an accident or a mistake. Even well-trained
      managers struggle with the operational complexity of a nuclear reactor.
      It’s not the kind of setting that seems well suited to a powerful but
      error-prone new technology.
    imageUrl: https://spectrum.ieee.org/media-library/three-men-smiling-together-in-front-of-an-exascale-supercomputer.jpg?id=68384674&width=1245&height=700&coordinates=0%2C62%2C0%2C63
    categories:
      - Nuclear-power
      - Artificial-intelligence
      - Epri
    publishedAt: 2026-10-08T14:28:17.000Z
    source: IEEE Spectrum — AI
  - title: This Disembodied Hand Is All the Robot You Need
    url: https://spectrum.ieee.org/walking-robotic-hand
    summary: A hand attached to the end of an arm is a given for most humans, but
      what if robots didn’t have to play by the same rules as we do? Researchers
      from ETH Zurich have turned an off-the-shelf robotic hand into a
      completely self-contained robot that walks on its fingertips while using
      those same fingers to manipulate its environment.
    imageUrl: https://spectrum.ieee.org/media-library/a-detached-robotic-hand-using-its-five-fingers-to-walk.jpg?id=68383398&width=1245&height=700&coordinates=0%2C187%2C0%2C188
    categories:
      - Robotics
      - Manipulation
      - Eth-zurich
      - Robot-grippers
    publishedAt: 2026-10-08T12:00:02.000Z
    source: IEEE Spectrum — Robotics
  - title: The U.S. Just Bet $1 Billion on Quantum Chip Manufacturing
    url: https://spectrum.ieee.org/anderon-quantum-fab
    summary: The U.S. Department of Commerce has finalized a CHIPS and Science Act
      R&D award of up to $1 billion for Anderon, a quantum foundry IBM
      established earlier this year. The 16 September announcement backs a
      manufacturing service for IBM and other quantum-hardware developers.
    imageUrl: https://spectrum.ieee.org/media-library/several-people-dressed-in-clean-suits-while-working-in-a-semiconductor-manufacturing-lab.jpg?id=68054174&width=1245&height=700&coordinates=0%2C62%2C0%2C63
    categories:
