  - title: "From vision to reality: A unified neural solver for the power grid"
    url: https://techxplore.com/news/2026-08-vision-reality-neural-solver-power.html
    summary: The electric grid has never mattered more—or faced more pressure. As
      transportation, buildings and industry electrify, ever more of modern life
      runs through the same network of wires. At the same time, the grid is
      being reshaped from both ends.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/from-vision-to-reality.jpg
