    source: IEEE Spectrum — AI
  - title: Interstellar solar sails hit a bizarre problem at 75% of light speed
    url: https://www.sciencedaily.com/releases/2026/11/261120071305.htm
    summary: "Scientists have discovered a surprising obstacle to interstellar
      travel: at extreme speeds, the light propelling futuristic solar sails
      could actually begin slowing them down. Once a spacecraft reaches 75% of
      the speed of light, some scattered light starts producing drag,
      potentially complicating humanity’s plans to reach distant stars."
    imageUrl: https://www.sciencedaily.com/images/1920/diffractive-solar-sail.webp
    categories: []
    publishedAt: 2026-11-22T11:59:29.000Z
    source: ScienceDaily — Engineering
  - title: New approach enables physically consistent AI models of chaotic systems
    url: https://news.mit.edu/new-approach-enables-physically-consistent-ai-models-chaotic-systems-1120
    summary: Modeling of complex, chaotic processes such as weather and climate
      patterns and turbulent flows in aviation or in ocean currents has advanced
      enormously in recent years. However, such models are still prone to drift
      into physically impossible predictions over time.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202611/mit-lids-stable_chaos.jpg?itok=yDuaaSB5
