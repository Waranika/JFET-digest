    publishedAt: 2026-11-11T13:00:03.000Z
    source: IEEE Spectrum — Computing & Chips
  - title: Build a Hidden Lock With a Magnetic Imager
    url: https://spectrum.ieee.org/magnetic
    summary: Like many a nerd, I have a certain fascination with locks. This
      originates in reading the memoir Surely You’re Joking, Mr. Feynman as a
      teenager, in which Richard Feynman recounts picking locks and cracking
      combinations while at his day job working on the Manhattan Project at Los
      Alamos. I currently have a couple of locksport pick sets and training
      locks that I purchased at hacker conferences over the years (although I’m
      still terrible at it), and I delight in the YouTube exploits of folks like
      the LockPickingLawyer.
    imageUrl: https://spectrum.ieee.org/media-library/a-medium-sized-box-with-an-open-lid-inside-is-a-lock-mechanism-a-battery-pack-and-some-circuit-boards.png?id=68493268&width=1200&height=400&coordinates=0%2C596%2C0%2C596
    categories:
