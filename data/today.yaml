  - title: Tiny sound waves could help solve a major quantum computing problem
    url: https://www.sciencedaily.com/releases/2026/09/260911214245.htm
    summary: Researchers at Harvard have demonstrated a way to protect quantum
      information using microscopic sound waves. By continuously surrounding a
      diamond-based qubit with mechanical vibrations, they extended its
      coherence time by roughly threefold. The same phonons could eventually
      both transmit and protect quantum information, opening the door to compact
      sound-based quantum networks on chips.
    imageUrl: https://www.sciencedaily.com/images/1920/silicon-vacancy-center-in-diamond-crystal-lattice.webp
    categories: []
    publishedAt: 2026-09-12T14:08:20.000Z
