  - title: Researchers reveal how 'ductile' tunnel supports deform under simulated
      squeezing-ground pressure
    url: https://techxplore.com/news/2026-07-reveal-ductile-tunnel-deform-simulated.html
    summary: When mountain tunnels are constructed in weak ground or under high
      ground pressure, the surrounding ground may deform significantly inward
      into the tunnel, a phenomenon known as squeezing ground. Under such
      conditions, conventional tunnel supports may crack or fail as ground
      deformation progresses.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/saitama-university-res-2.jpg
