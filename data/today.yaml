  - title: Robot Finger Feels in Color
    url: https://spectrum.ieee.org/robot-finger
    summary: Imagine running your fingertip over the surface of a U.S. penny. You
      would feel the ridges of the raised letters and numbers, Abe Lincoln’s
      bearded side profile, and, if it’s tails, the fluted columns of the
      Lincoln Memorial. Getting a robot to sense the same things is an imposing
      task, often requiring gathering data on pressure and force at many spatial
      locations at once. But that’s just what a team of scientists in Europe has
      now managed to do, using an unusual, colorful robotic skin that provides
      high-resolution sensing in real time.
    imageUrl: https://spectrum.ieee.org/media-library/close-up-of-a-sensor-for-a-robotic-fingertip-and-raised-relief-images-of-a-leaf-and-a-u-s-penny.jpg?id=67542077&width=1245&height=700&coordinates=0%2C187%2C0%2C188
    categories:
