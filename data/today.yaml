  - title: Meet Shepherd, the Meta-Agent Keeping Rogue AI In Check
    url: https://spectrum.ieee.org/ai-agent-manager
    summary: AI agents are running amok on the internet, armed with commands to
      accomplish certain tasks but often acting in undesirable or unexpected
      ways. These rogue incidents run the gamut from deleting an entire email
      inbox to hacking websites and even launching cyberattacks.
    imageUrl: https://spectrum.ieee.org/media-library/illustration-of-an-ai-agent-supervising-and-designating-tasks-to-smaller-ai-agents.jpg?id=68511562&width=1245&height=700&coordinates=0%2C156%2C0%2C157
