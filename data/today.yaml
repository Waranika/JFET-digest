  - title: JWST’s mysterious little red dots may be black holes growing at
      incredible speeds
    url: https://www.sciencedaily.com/releases/2026/09/260917003703.htm
    summary: New supercomputer simulations suggest JWST’s puzzling Little Red Dots
      are rapidly growing black holes from the early Universe. Extreme radiation
      may have helped create unusually massive black hole seeds, while dense
      surrounding gas allowed them to grow dozens of times faster than black
      holes can today. The simulated objects closely resemble the Little Red
      Dots seen by Webb. If correct, they could solve the mystery of how
      enormous black holes formed so soon after the Big Bang.
    imageUrl: https://www.sciencedaily.com/images/1920/rapidly-growing-black-hole-aterui-iii-simulation.webp
    categories: []
    publishedAt: 2026-09-17T12:45:48.000Z
    source: ScienceDaily — Computer Science
  - title: Robotic lab sets up and runs optics experiments on demand
    url: https://news.mit.edu/2026/robotic-lab-runs-optics-experiments-on-demand-0917
    summary: Every new generation of phone display, television screen, and solar
      panel is a result of precision optics experiments, which use lasers and
      other light sources to measure the optical properties of candidate
      materials. These experiments can take months to run, requiring scientists
      to meticulously angle and adjust delicate light sources, mirrors, cameras,
      and other components, in a careful and constant tuning that can be
      physically tedious and time-consuming.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202609/MIT-Robot-Labs-01-press.jpg?itok=GJV66E88
    categories: []
    publishedAt: 2026-09-17T04:00:00.000Z
    source: MIT Robotics
