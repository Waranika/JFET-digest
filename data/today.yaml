  - title: Why teaching AI about symmetry could make prenatal diagnosis more reliable
    url: https://news.mit.edu/2026/teaching-ai-about-symmetry-could-make-prenatal-diagnosis-more-reliable-1019
    summary: "Despite millions of years of evolution, the development of the human
      fetus remains a complex process that is vulnerable to genetic,
      environmental, and metabolic disruptions. These disruptions could result
      in developmental abnormalities, starting with one of the first organs to
      begin developing in the fetus that continues to develop after birth: the
      brain."
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202609/mit-jameel-clinic-fetal-brain.jpg?itok=TGq3tK5p
    categories: []
    publishedAt: 2026-10-19T18:20:00.000Z
    source: MIT Artificial Intelligence
  - title: The Robot I Didn’t Expect to Build
    url: https://spectrum.ieee.org/agility-robotics-digit-5-redesign
    summary: Agility Robotics, the company I cofounded out of my robotics lab at
      Oregon State University in 2015, has just launched Digit 5. It’s designed
      to be the first humanoid robot that can safely and economically do useful
      work at scale, allowing us to bring tens of thousands of humanoid workers
      into the real world. Engineered to lift 23-kilogram bins onto high shelves
      and with a battery that can run for 90 minutes on a 9-minute charge, Digit
      5’s goal is to handle heavy warehouse tasks shift after shift, filling the
      need for labor in jobs that are too physically stressful or too dull for
      humans to want to do.
    imageUrl: https://spectrum.ieee.org/media-library/author-jonathan-hurst-a-tall-slim-white-man-wearing-a-black-long-sleeve-shirt-and-dark-jeans-stands-next-to-his-digit-5-humano.jpg?id=68441166&width=1245&height=700&coordinates=0%2C1422%2C0%2C1423
    categories:
      - Robotics
      - Humanoid-robots
      - Agility-robotics
      - Bipedal-robot
    publishedAt: 2026-10-19T13:00:03.000Z
    source: IEEE Spectrum — Robotics
