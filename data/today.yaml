  - title: AI uncovers hidden Ozempic side effects across 400,000 Reddit posts
    url: https://www.sciencedaily.com/releases/2026/09/260912222856.htm
    summary: AI analysis of 400,000 Reddit posts found that users of drugs such as
      Ozempic, Wegovy, Mounjaro, and Zepbound reported unexpected symptoms
      including menstrual changes, chills, hot flashes, and fatigue. Researchers
      cannot say the medications caused these problems, but the patterns may
      reveal overlooked signals worth studying.
    imageUrl: https://www.sciencedaily.com/images/1920/woman-face-close-up-surprise-worry-fear.webp
    categories: []
    publishedAt: 2026-09-13T10:46:19.000Z
