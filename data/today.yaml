  - title: "When AI art has no author: Study finds generated images often can’t be
      traced to training data"
    url: https://news.mit.edu/2026/when-ai-art-has-no-author-generated-images-often-cant-be-traced-to-training-data-0818
    summary: When an artificial intelligence image generator produces a portrait,
      whose work went into it? The question sits at the center of lawsuits,
      licensing deals, and proposed regulations worldwide. Artists want credit.
      Companies want clarity. Policymakers want a way to assign responsibility.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202608/dai-gifford-ai-image-training-data-00_0.png?itok=BM5jagA4
