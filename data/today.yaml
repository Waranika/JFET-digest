  - title: Better communication could improve human-robot teamwork across real-world
      tasks
    url: https://techxplore.com/news/2026-08-communication-human-robot-teamwork-real.html
    summary: "A new paper from Monash University and Australia's national science
      agency, CSIRO, argues that effective human–robot teams depend on
      alignment: a shared and up-to-date understanding of each teammate's
      capabilities and limitations, the task and situation, and their respective
      roles and timing."
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2022/robot.jpg
    categories:
