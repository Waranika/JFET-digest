  - title: Upcycled battery materials roughly double cell cycle life in tests
    url: https://techxplore.com/news/2026-10-upcycled-battery-materials-roughly-cell.html
    summary: A new recycling approach developed by Worcester Polytechnic Institute
      (WPI) researchers could help make battery waste a valuable source of
      high-performance materials. In a study published in Advanced Energy
      Materials, a team led by professor Yan Wang, the William B. Smith
      Professor of Mechanical and Materials Engineering, converted mixed battery
      waste into upcycled materials for both the cathode and anode and found
      that the resulting pouch cells outlasted cells made with commercial
      counterparts.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/upcycled-battery-mater.jpg
    categories:
      - Engineering
    publishedAt: 2026-10-16T20:00:07.000Z
