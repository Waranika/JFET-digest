  - title: Two-armed robot throws and catches balls with human-like movements
    url: https://techxplore.com/news/2026-10-armed-robot-balls-human-movements.html
    summary: Humans can move their limbs very rapidly and coordinate their movements
      with high precision to tackle specific manual tasks. While robots have
      become increasingly advanced in recent years, many of them remain less
      agile than humans and struggle to interact with moving objects of
      different shapes, weights and textures.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/two-armed-robot-throws-3.jpg
    categories:
