  - title: IBM Claims Quantum Advantage With New Validation Techniques
    url: https://spectrum.ieee.org/ibm-verifiable-quantum-advantage
    summary: "Quantum computers promise to solve problems beyond the most powerful
      classical supercomputers. But this raises a fundamental challenge: how do
      you prove the validity of answers that can’t be calculated any other way?
      In a trio of papers released yesterday, IBM and collaborators say they
      have demonstrated several techniques for solving this conundrum."
    imageUrl: https://spectrum.ieee.org/media-library/on-the-left-a-many-tiered-gold-structure-with-cylindrical-design-on-the-right-a-metallic-chip.jpg?id=67557437&width=1245&height=700&coordinates=0%2C62%2C0%2C63
