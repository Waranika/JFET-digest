  - title: Rubber ducks and screwdrivers put dexterous new soft robotic gripper to
      the test
    url: https://techxplore.com/news/2026-10-rubber-ducks-screwdrivers-dexterous-soft.html
    summary: Professors at the Universidad Carlos III de Madrid (UC3M) and the
      Universidad Pública de Navarra (UPNA) have developed a soft robotic
      gripper capable not only of picking up and holding objects but also of
      manipulating and repositioning what it holds between its fingers without
      losing its grip.
