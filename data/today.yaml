  - title: Lab-grown mouse muscles enable tiny robots to jump, swim, walk and grasp
    url: https://techxplore.com/news/2026-10-lab-grown-mouse-muscles-enable.html
    summary: Lab-grown skeletal muscle tissue can contract, but the movement is
      often so slight that it is barely visible. This poses a problem for
      biohybrid robots designed to move using living muscles. Researchers at ETH
      Zurich have now demonstrated that it is not just the amount of muscle
      tissue that matters, but above all how the muscle and the artificial
      scaffold interact.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/researchers-develop-mu.jpg
