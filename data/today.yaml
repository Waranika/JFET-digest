  - title: The secret to building Moon bases may be hiding in emergency blankets
    url: https://www.sciencedaily.com/releases/2026/11/261115085549.htm
    summary: Scientists have turned the thin plastic used in emergency blankets into
      remarkably strong insulation that could help astronauts survive the Moon's
      extreme temperatures. Built from hundreds of stacked layers, the material
      withstands crushing pressure without losing its thermal protection,
      potentially paving the way for tougher, longer-lasting lunar habitats.
    imageUrl: https://www.sciencedaily.com/images/1920/stacking-layers-of-mylar-for-lunar-insulation.webp
    categories: []
    publishedAt: 2026-11-16T03:51:01.000Z
    source: ScienceDaily — Engineering
  - title: Why Skydio Built a Lopsided Drone
    url: https://spectrum.ieee.org/skydio-f10-lightrunner-asymmetrical-drone
    summary: Skydio’s drones have always been magical. From MIT research and early
      prototypes to what I would argue is still the most advanced consumer drone
      ever made, this is a company that makes very cool stuff. Sadly, Skydio no
      longer makes cool stuff for consumers, instead focusing on drone platforms
      for public safety, inspection, and other things that, on a good day, don’t
      affect me personally.
