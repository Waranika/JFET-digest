  - title: New Platform Peers Inside AI’s Black Box
    url: https://spectrum.ieee.org/silico-ai-interpretability
    summary: Prompt Claude, ChatGPT, Gemini, or any other popular large language
      model with a question like “What is the best film ever made?” and the
      response will vary. And you (and most worryingly, the people who built the
      LLM) have little idea exactly how it came up with that specific answer.
    imageUrl: https://spectrum.ieee.org/media-library/goodfire-ais-silico-uses-agents-equipped-with-interpretability-tools-to-examine-the-reasoning-behind-an-ai-model.jpg?id=67668252&width=1245&height=700&coordinates=0%2C62%2C0%2C63
    categories:
