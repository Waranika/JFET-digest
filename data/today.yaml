  - title: Swift Saw the Secrets of Space Before Falling to Earth
    url: https://www.wired.com/story/swift-saw-the-secrets-of-space-before-falling-to-earth/
    summary: Designed for a two-year mission, the Neil Gehrels Swift Observatory saw
      thousands of gamma-ray bursts and stars being torn apart by black holes
      over 22 years before burning up in Earth’s atmosphere.
    imageUrl: https://media.wired.com/photos/6afdfad71581bbef3a3945cc/191:100/w_1280,c_limit/Swift_in_space_15_ac.jpg
    categories:
      - Science
      - Science / Space
    publishedAt: 2026-11-28T11:30:00.000Z
    source: WIRED science
  - title: The physics wall facing orbital AI data centers
    url: https://techxplore.com/news/2026-11-physics-wall-orbital-ai-centers.html
    summary: Basing entire business plans on back-of-the-envelope calculations might
      not seem like the best idea. However, according to a new paper by Dr.
      Slava Turyshev of NASA's Jet Propulsion Laboratory, available as a
      preprint on arXiv, that is precisely what the companies touting orbital AI
      data centers are doing.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/the-physics-wall-facin.jpg
    categories:
      - Computing & Networks
    publishedAt: 2026-11-28T02:40:05.000Z
    source: TechXplore — Computer Science
  - title: Frozen language model helps predict materials properties with roughly 95%
      less training time
    url: https://techxplore.com/news/2026-11-frozen-language-materials-properties-roughly.html
    summary: Discovering new materials often involves predicting their properties
      before investing time and resources in making and testing them in the
      laboratory. Machine-learning models are widely used to estimate important
      properties, such as band gap and formation energy, helping researchers
      narrow down candidate materials. More recently, large language models
      (LLMs) have offered a flexible way to represent materials through text for
      property prediction.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/zebra-prop-a-lightweig.jpg
    categories:
      - Artificial Intelligence
    publishedAt: 2026-11-27T18:40:02.000Z
    source: TechXplore — AI & Machine Learning
