  - title: Compact AI training method reduces navigation conflicts in crowded
      environments
    url: https://techxplore.com/news/2026-09-compact-ai-method-conflicts-crowded.html
    summary: A research team led by Professor Daehee Park of the Department of
      Electrical Engineering and Computer Science at DGIST, in collaboration
      with a research team from KAIST, has developed a learning technique that
      enables a single compact AI model to simultaneously predict the movements
      of nearby people and plan safe navigation paths for robots while reducing
      performance degradation in both tasks. The research was presented at the
      19th European Conference on Computer Vision (ECCV 2026) held in Malmö,
      Sweden, Sept. 8–12. The paper is available on the arXiv preprint server.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/compact-ai-training-me.jpg
    categories:
      - Robotics
    publishedAt: 2026-09-16T22:00:03.000Z
    source: TechXplore — Robotics
  - title: Your brain runs on 20 watts. Could brain‑inspired computing do the same?
    url: https://techxplore.com/news/2026-09-brain-watts-braininspired.html
    summary: Right now, your brain is recognizing the shapes of these letters,
      analyzing their meaning and holding a stream of thought together—all on
      about 20 watts of power. That's roughly what it takes to run a light bulb.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/your-brain-runs-on-20.jpg
