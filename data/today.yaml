  - title: The importance of indoor airflow patterns in spreading airborne disease
    url: https://news.mit.edu/2026/indoor-airflow-patterns-importance-spreading-airborne-disease-0821
    summary: Tuberculosis (TB) is a leading cause of infectious disease deaths,
      claiming over 1 million lives every year. It spreads through the air when
      an infected person coughs, sneezes, or exhales, and drug-resistant strains
      and asymptomatic spreading are growing concerns. Curbing TB transmission
      is an urgent public health challenge, yet scientists still don’t
      understand how airflow and other environmental factors influence that
      spread.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202608/MIT-TB-Airflow-01-press.jpg?itok=AdQOVoGi
    categories: []
    publishedAt: 2026-08-21T16:00:00.000Z
    source: MIT Engineering
  - title: Paving the way for greener ammonia production
    url: https://news.mit.edu/2026/paving-way-for-greener-ammonia-production-0820
    summary: Ammonia is one of the most important chemicals produced in the world,
      ranking second only to sulfuric acid in the total volume produced each
      year. It is used mostly to make fertilizer, which is essential to feeding
      the world’s population. Yet its production accounts for up to 2 percent of
      the world’s energy consumption and about 1.5 percent of greenhouse gas
      emissions, so the search has been underway for ways to produce ammonia
      more sustainably.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202608/mit-dmse-ammonia-facility.jpg?itok=JxRn8ST5
    categories: []
    publishedAt: 2026-08-20T18:45:00.000Z
    source: MIT Artificial Intelligence
  - title: MIT engineers design a better controller for operating construction diggers
    url: https://news.mit.edu/2026/mit-engineers-design-better-controller-operating-construction-diggers-0820
    summary: Anyone who’s ever wrestled with a claw machine at an arcade can
      appreciate the difficulty in pulling and pushing on joysticks, in just the
      right way, to get a mechanical arm to scoop up that one special toy.
      Coordinating the joysticks and connecting their movement to the claw’s
      motion is a type of “mental mapping” that is not immediately intuitive.
      (And it’s what arcade owners depend on to bring players back, again and
      again).
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202608/MIT-DiggerTrainer-01-press.jpg?itok=X5SSiyJU
    categories: []
