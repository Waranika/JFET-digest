  - title: When Does It Actually Make Sense to Put AI Into Products?
    url: https://spectrum.ieee.org/human-centered-ai-product-design
    summary: Over the past few years, the tech industry has rushed to plug a new
      microchip into every device on the assumption that if you can add AI, you
      should. Smart-vision toothbrushes, mood-reading household robots, and a
      host of physical products are invading consumers’ daily lives, reliant on
      artificial intelligence to learn, predict, and adjust our behavior.
    imageUrl: https://spectrum.ieee.org/media-library/photo-collage-of-a-woman-speaking-on-stage-with-electric-toothbrushes-and-refrigerators-layered-in-the-background.jpg?id=68653834&width=1200&height=400&coordinates=0%2C729%2C0%2C730
    categories:
      - Product-design
      - Product-development
      - Ai-gadgets
      - User-centered-design
    publishedAt: 2026-11-11T14:00:02.000Z
    source: IEEE Spectrum — AI
  - title: NSF’s X-Labs Program Draws Support From Charities and Investors
    url: https://spectrum.ieee.org/national-science-foundation-x-labs
    summary: When the U.S. National Science Foundation began its X-Labs program in
      May, the agency said the higher-risk, higher-funded awards would create
      new kinds of partnerships that would confront urgent scientific and
      technological challenges. Now the NSF is doubling down on the idea, with
      an announcement in October that charities, companies, and investment funds
      would provide X-Lab winners practical support such as laboratory space,
      software, shared equipment, and access to key data and expert guidance.
    imageUrl: https://spectrum.ieee.org/media-library/three-men-conversing-in-front-of-a-construction-sign-on-a-dirt-lot.jpg?id=68653956&width=1245&height=700&coordinates=0%2C156%2C0%2C157
    categories:
      - National-science-foundation
      - Research
      - Science-funding
    publishedAt: 2026-11-11T13:00:03.000Z
    source: IEEE Spectrum — Computing & Chips
  - title: Can Agentic Robotics Solve Robotics’ Data-Scaling Problem?
    url: https://spectrum.ieee.org/agentic-robotics
    summary: Robotics companies are investing heavily in the belief that data will
      solve the most difficult problems in robotics. Once AI systems have
      ingested enough data from human demonstrations, the thinking goes, robots
      will be able to perform the vast majority of the manual tasks that humans
      now do. There are even robotics companies that exist solely to collect
      training data and sell it to other robotics companies in pursuit of this
      goal.
    imageUrl: https://spectrum.ieee.org/media-library/3d-rendering-of-a-scara-robotic-arm-carefully-dropping-a-syringe-into-a-sharps-box.jpg?id=68618830&width=1200&height=400&coordinates=0%2C849%2C0%2C850
    categories:
      - Robotics
      - Agentic-ai
      - Coding-agents
      - Manufacturing-robots
      - Agentic-robotics
    publishedAt: 2026-11-09T14:00:02.000Z
    source: IEEE Spectrum — Robotics
  - title: A hidden limit of space and time could unlock electronics 100,000 times
      faster
    url: https://www.sciencedaily.com/releases/2026/11/261106174537.htm
    summary: Scientists have discovered a surprising quantum limit that prevents
      electrons from being tracked with unlimited precision in both space and
      time. The breakthrough could pave the way for manipulating chemical
      reactions and developing electronics hundreds of thousands of times faster
      than today's technology.
    imageUrl: https://www.sciencedaily.com/images/1920/extremely-short-electron-wave-packet-at-limits-of-space-and-time.webp
    categories: []
    publishedAt: 2026-11-07T23:34:19.000Z
    source: ScienceDaily — Robotics
  - title: Build a Hidden Lock With a Magnetic Imager
    url: https://spectrum.ieee.org/magnetic
    summary: Like many a nerd, I have a certain fascination with locks. This
      originates in reading the memoir Surely You’re Joking, Mr. Feynman as a
      teenager, in which Richard Feynman recounts picking locks and cracking
      combinations while at his day job working on the Manhattan Project at Los
      Alamos. I currently have a couple of locksport pick sets and training
      locks that I purchased at hacker conferences over the years (although I’m
      still terrible at it), and I delight in the YouTube exploits of folks like
      the LockPickingLawyer.
    imageUrl: https://spectrum.ieee.org/media-library/a-medium-sized-box-with-an-open-lid-inside-is-a-lock-mechanism-a-battery-pack-and-some-circuit-boards.png?id=68493268&width=1245&height=700&coordinates=0%2C385%2C0%2C386
    categories:
