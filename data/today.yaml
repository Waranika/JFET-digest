  - title: AI drone outpaces former world champions using one camera and no GPS
    url: https://techxplore.com/news/2026-10-ai-drone-outpaces-world-champions.html
    summary: What does it take for an autonomous robot to be faster around a course
      than human drone pilots? At these dizzying speeds, humans need
      lightning-fast reflexes. Researchers at Delft University of Technology
      (the Netherlands) have developed an AI system that enables a racing drone
      to navigate demanding courses at extreme speed using only a single camera.
      It outperformed even former world champion human drone pilots in a race.
