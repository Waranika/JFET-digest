  - title: AI agents struggle to perform original scientific research
    url: https://techxplore.com/news/2026-08-ai-agents-struggle-scientific.html
    summary: Among the many predictions about the future of artificial intelligence
      is that models will one day be able to conduct scientific research on
      their own, leaving humans out of the equation. Already, they can write
      code, run experiments and search scientific literature, but carrying out
      open-ended research would require a significant leap in ability.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/scientific-research.jpg
    categories:
      - Computer Sciences
    publishedAt: 2026-08-14T17:00:03.000Z
