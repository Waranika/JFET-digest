  - title: Siobahn Day Grady Wants Everyone to Be AI Literate
    url: https://spectrum.ieee.org/siobahn-day-grady-ai-hbcu
    summary: Artificial intelligence is reshaping the skills employers expect from
      new graduates. In response, universities are scrambling to launch new
      courses, research centers, and industry partnerships that prepare students
      for today’s workforce. But building a cutting-edge AI curriculum demands
      funding and access to industry networks, resources that remain unevenly
