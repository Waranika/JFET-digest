  - title: Scientists build a nuclear clock that could make atomic clocks obsolete
    url: https://www.sciencedaily.com/releases/2026/10/261008102701.htm
    summary: Scientists in Vienna have achieved a major breakthrough in timekeeping
      by creating the world’s first self-stabilizing nuclear clock, a technology
      that could eventually surpass even the most precise atomic clocks. Instead
      of relying on electrons in atoms, the clock uses the tiny nuclei of
      thorium atoms, which are far less sensitive to outside disturbances.
    imageUrl: https://www.sciencedaily.com/images/1920/nuclear-clock-concept.webp
    categories: []
    publishedAt: 2026-10-11T03:06:35.000Z
    source: ScienceDaily — Engineering
