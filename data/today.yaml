  - title: Steam-assisted method makes lightweight magnesium tougher and conductive
    url: https://techxplore.com/news/2026-09-steam-method-lightweight-magnesium-tougher.html
    summary: Magnesium alloys are attractive for advanced energy technologies
      because of their exceptional strength-to-weight ratio. However, despite
      being the lightest structural metals available, they corrode rapidly in
      acidic environments, while their native oxides and conventional protective
      coatings are electrically insulating. This combination has limited their
      use in demanding applications such as polymer electrolyte fuel cells
      (PEFCs), where components must resist corrosion while efficiently
      conducting electricity.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/new-low-temperature-co.jpg
    categories:
