  - title: AI discovers a hidden heart signal that could predict sudden death
    url: https://www.sciencedaily.com/releases/2026/11/261112230456.htm
    summary: Scientists have uncovered a hidden warning sign in routine heart scans
      that could predict sudden cardiac death before it strikes. The AI-powered
      discovery outperformed conventional screening methods, potentially
      revealing thousands of people at risk of a fatal heart malfunction that
      doctors might otherwise miss.
    imageUrl: https://www.sciencedaily.com/images/1920/cardiology-heart-attack-disease-prevention.webp
    categories: []
    publishedAt: 2026-11-15T01:05:10.000Z
    source: ScienceDaily — Robotics
  - title: Europe’s Digital Wallets May Be More Traceable Than Intended
    url: https://spectrum.ieee.org/europe-digital-id-security-cryptography
    summary: Millions of European Union citizens should soon have access to digital
      wallets, as member states roll out their implementations of the European
      Digital Identity Regulation ahead of an end-of-the-year deadline. But the
      digital-identity wallets, which are intended to provide a secure and
      private place to store identifying information such as bank-account
      information, diplomas, and government IDs, such as driver’s licenses,
      could leave behind a trail of cryptographic clues that makes it possible
      to recognize someone across services. Cryptographers warn that the
      technology protecting individual privacy may not yet go far enough to stop
      people from being tracked.
    imageUrl: https://spectrum.ieee.org/media-library/conceptual-illustration-of-a-bank-vault-covered-in-binary-code-and-circuit-board-lines.jpg?id=68680479&width=1200&height=400&coordinates=0%2C1082%2C0%2C1082
    categories:
      - Digital-ids
      - European-union
      - Cryptography
    publishedAt: 2026-11-14T14:00:02.000Z
    source: IEEE Spectrum — Computing & Chips
  - title: Robots recognize the shape of an arena by messaging each other
    url: https://techxplore.com/news/2026-11-robots-arena-messaging.html
    summary: Humans can create loose maps of environments they are exploring in
      their minds, using their senses and navigation skills. Many robots, on the
      other hand, rely on set maps of known environments or new maps produced
      using data collected by their sensors.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/robots-recognize-the-s.jpg
    categories:
      - Robotics
    publishedAt: 2026-11-14T13:40:02.000Z
