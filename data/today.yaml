  - title: Cyborg Roaches Can Stab You With Needles
    url: https://spectrum.ieee.org/cyborg-rescue-roach
    summary: Imagine you are trapped under rubble after an earthquake and you see an
      electronics-covered cockroach with a spring-loaded needle on its back
      scuttling toward you. Although the sight might be unnerving, to say the
      least, this prototype paramedic cyborg, or “Paraborg,” might one day help
      deliver lifesaving aid to disaster victims who might be otherwise
      impossible to reach.
    imageUrl: https://spectrum.ieee.org/media-library/large-brown-cockroach-fitted-with-an-electronic-device-and-wires-on-its-back.jpg?id=67724302&width=1245&height=700&coordinates=0%2C62%2C0%2C63
