  - title: Light-powered soft robots that can keep jumping forever
    url: https://techxplore.com/news/2026-08-powered-soft-robots.html
    summary: Researchers from North Carolina State University have created
      teardrop-shaped soft robots that leap upward or forward when exposed to
      infrared light—and will keep jumping as long as the light is present. The
      work demonstrates a new mechanism for self-resetting jumping behavior in
      soft robotics.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/light-powered-soft-rob.jpg
    categories:
