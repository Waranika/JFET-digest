      - Ieee-milestone
      - Computing
      - Encryption
      - Colossus
    publishedAt: 2026-07-22T18:00:01.000Z
    source: IEEE Spectrum — Computing & Chips
  - title: MIT’s new lidar chip could give self-driving cars a wider view
    url: https://www.sciencedaily.com/releases/2026/07/260722032127.htm
    summary: MIT engineers have found a way to give chip-based lidar a wider,
      clearer view without relying on moving parts. Their design uses
      differently shaped antennas that can sit close together without scrambling
      one another’s signals. In tests, the system sharply reduced interference
      while steering a single precise beam across a broad field of view.
    imageUrl: https://www.sciencedaily.com/images/1920/mit-array-of-integrated-antennas.webp
    categories: []
    publishedAt: 2026-07-22T10:00:54.000Z
    source: ScienceDaily — Computer Science
  - title: New AI blood test predicts heart disease 15 years early
    url: https://www.sciencedaily.com/releases/2026/07/260716023603.htm
    summary: A new AI-powered blood test could give people a remarkably early
      warning of serious heart and circulation problems. Developed by
      researchers at the University of Hong Kong, CardiOmicScore analyzes
      thousands of proteins and metabolites to estimate the risk of six major
      cardiovascular diseases, including heart attack, stroke, heart failure,
      and atrial fibrillation. Unlike genetic risk scores, which remain fixed
      throughout life, the system captures biological changes linked to a
      person’s current health, lifestyle, and environment.
    imageUrl: https://www.sciencedaily.com/images/1920/ai-cardiology.webp
    categories: []
    publishedAt: 2026-07-19T14:58:00.000Z
    source: ScienceDaily — Robotics
  - title: Scientists built a camera that can track invisible particles in 3D
    url: https://www.sciencedaily.com/releases/2026/07/260716023610.htm
    summary: A new particle detector called PLATON could replace millions of tiny
      detector components with a single block of light-producing material. Using
      a light-field camera, highly sensitive photon sensors, and AI, it
      reconstructs particle paths in fast, detailed 3D. Simulations suggest it
      could match or surpass today’s best detectors while being far easier to
      scale. The technology may also lead to sharper PET medical scans.
    imageUrl: https://www.sciencedaily.com/images/1920/neutrinos-interaction-camera.webp
    categories: []
    publishedAt: 2026-07-17T06:04:57.000Z
    source: ScienceDaily — Engineering
  - title: Can AI build a jet engine? JARVIS Challenge tests role of AI copilots in
      tough-tech engineering
    url: https://news.mit.edu/2026/can-ai-build-jet-engine-jarvis-challenge-tests-ai-copilots-in-tough-tech-engineering-0714
    summary: Artificial intelligence has rapidly transformed software engineering.
      Generative AI and large language models (LLMs) can create huge volumes of
      code and documentation; machine-learning algorithms can monitor
      performance and detect security vulnerabilities. But when the task is to
      conceive, design, and make a complex physical system such as a jet engine,
      are those AI tools equally transformative?
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202607/jarvis-competition-fired-engine-00.jpg?itok=fB5FluyQ
    categories: []
    publishedAt: 2026-07-14T18:00:00.000Z
    source: MIT Robotics
