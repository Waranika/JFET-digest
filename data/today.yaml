  - title: Virtual markers help smartphone cameras reconstruct lifelike multi-person
      movement, from hugs to martial arts
    url: https://techxplore.com/news/2026-09-virtual-markers-smartphone-cameras-reconstruct.html
    summary: For decades, the gold standard for capturing human movement and
      transferring these data into the digital world has required actors to wear
      suits with physical markers that cameras track in a specialized studio.
      While accurate, this capture process is time-consuming and expensive.
      Markers need to be placed manually, they can fall off, and if two people
      get too close—such as during a hug or a dance—the system fails to track
      all markers as one person blocks the other from the camera's view, and
      accuracy drops significantly. Extensive post-processing is needed to
      recover the motion in such challenging sequences. The creators of the
      Hollywood blockbusters "Avatar" or "The Lord of the Rings" will know what
      we mean.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/mamma-mia-few-smartpho.jpg
    categories:
      - Computer Sciences
    publishedAt: 2026-09-22T20:00:06.000Z
    source: TechXplore — Computer Science
  - title: Poitras Center to fuel early careers of 50 young scientists dedicated to
      psychiatric disorders research
    url: https://news.mit.edu/2026/poitras-center-to-fuel-early-careers-50-young-scientists-psychiatric-disorders-research-0922
    summary: Patricia and James Poitras ’63, longtime MIT supporters, have launched
      a fellowship program for graduate students and postdocs studying major
      mental illness, expanding their MIT philanthropy to directly support
      early-career scientists. The commitment establishes 50 two-year
      fellowships through the Poitras Center for Psychiatric Disorders
      Research at MIT’s McGovern Institute for Brain Research. Five fellowships
      will be awarded every year for the next decade, creating a long-term
      talent pipeline focused specifically on psychiatric disorders.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202609/mit-mcgovern-poitras-fellows.jpg?itok=c7br6l9h
    categories: []
