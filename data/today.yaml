  - title: AI model captures how humans read, paving the way to personalized text
      and better augmented reality
    url: https://techxplore.com/news/2026-08-ai-captures-humans-paving-personalized.html
    summary: Researchers at Aalto University, together with international partners,
      have developed the most accurate model yet of how humans read. The new
      model uses reinforcement learning, a type of AI used in robotics, to
      explain—and recreate—the choices readers make as they move through text.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/ai-model-uses-reinforc.jpg
    categories:
      - Hi Tech & Innovation
    publishedAt: 2026-08-10T21:00:11.000Z
    source: TechXplore — AI & Machine Learning
  - title: New coding technique skips needless calculations, speeding some GPU tasks
      nearly fourfold
    url: https://techxplore.com/news/2026-08-coding-technique-needless-gpu-tasks.html
    summary: The multiplication of matrices and higher-dimensional arrays called
      tensors lies at the heart of modern computing. Matrix or tensor
      multiplication is, in fact, the most common operation carried out in
      artificial intelligence applications, as well as in scientific simulations
      and computer graphics. High-performance computers, especially those
      equipped with graphics processing units (GPUs), are designed to work with
      so-called dense matrices or tensors—those that have relatively few zero
      elements.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/a-new-way-to-speed-up.jpg
    categories:
      - Hardware
    publishedAt: 2026-08-10T20:40:05.000Z
    source: TechXplore — Computer Science
  - title: With a feel for physics, AI models simulate a wider range of real-world
      scenarios
    url: https://news.mit.edu/2026/ai-models-simulate-wider-range-of-real-world-scenarios-0810
    summary: Artificial intelligence models are jacks of many trades, including
      writing, generating images, and creating 3D models. But they aren’t as
      helpful when it comes to testing robots or designs for vehicles in diverse
      environments, since they don’t understand physics as well as they do
      pixels or text.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202608/mit-csail-geopt.jpg?itok=QbX1i1qV
    categories: []
    publishedAt: 2026-08-10T19:25:00.000Z
    source: MIT Artificial Intelligence
  - title: Robot Recycler Salvages Parts from Broken Machines
    url: https://spectrum.ieee.org/recycling-robot
    summary: Objects constructed by robots are ubiquitous. If you’ve used a car,
      household appliance, or smartphone today, you’ve used an object
      constructed at least in part by robots. The more products that
      manufacturers want to produce (and consumers want to consume) at lower
      costs, the more industrial robots will be needed.
    imageUrl: https://spectrum.ieee.org/media-library/two-large-industrial-robotic-arms-in-a-university-laboratory.jpg?id=67561939&width=1245&height=700&coordinates=0%2C156%2C0%2C157
    categories:
