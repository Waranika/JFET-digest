  - title: MIT class project turns into an FDA-cleared treatment for tremors
    url: https://news.mit.edu/2026/mit-class-project-turns-into-fda-cleared-treatment-for-tremors-1002
    summary: In 2017, a man named Michael walked onto stage in front of a packed
      Kresge Auditorium at MIT and attempted to draw a spiral, a common test
      doctors use to diagnose Parkinson’s disease. His tremors, caused by the
      disease, made the exercise difficult.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202610/MIT-Encora-Therapeutics-01-press.jpg?itok=1vCDHH4L
    categories: []
