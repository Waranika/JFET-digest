  - title: New engineering studies aim to slow battery aging while idle
    url: https://techxplore.com/news/2026-08-aim-battery-aging-idle.html
    summary: Most batteries spend more than 70% of their lifetime at rest. Yet few
      studies have examined calendar aging, which is how a battery degrades when
      it is neither charging nor being used.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/new-ucla-engineering-s.jpg
    categories:
      - Engineering
    publishedAt: 2026-08-10T21:40:05.000Z
