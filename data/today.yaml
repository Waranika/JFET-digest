  - title: Building blocks for a greener skyline
    url: https://news.mit.edu/2026/building-blocks-for-greener-skyline-miana-smith-1118
    summary: The construction industry is often cited as contributing over one-third
      of global greenhouse gas emissions, in large measure because buildings use
      more material than they need to. Miana Smith ’21, SM ’23, PhD ’26, a
      recent graduate and visiting researcher who is part of the Center for Bits
      and Atoms research team in MIT's Program in Media Arts and Sciences, has
      spent years trying to fix that by reimagining how buildings get put
      together.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202610/mit-meche-miana-smith.jpg?itok=AwwH_0B4
