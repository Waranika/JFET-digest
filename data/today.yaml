  - title: New drone prototype folds itself through gaps half its width during flight
    url: https://techxplore.com/news/2026-11-drone-prototype-gaps-width-flight.html
    summary: Drones are now commonly used in areas that are difficult for humans to
      access, but these spaces often have small or awkwardly shaped regions that
      are also difficult for drones to access. Some designs have attempted to
      overcome these limitations with shape-changing mechanisms that require
      extra motors or special thrust maneuvers, but these usually add complexity
      or restrict movement in other ways.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/new-drone-prototype-fo.jpg
    categories:
      - Robotics
    publishedAt: 2026-11-23T18:20:07.000Z
