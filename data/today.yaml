  - title: Maple-seed-inspired robot flies more accurately with predictive control
    url: https://techxplore.com/news/2026-09-maple-seed-robot-flies-accurately.html
    summary: A flying robot with just one moving part may sound simple. Controlling
      one precisely is anything but. Most conventional drones rely on several
      rotors to control how they rise, turn and move. A robot with only one
      actuator has far fewer ways to correct itself when it drifts off course,
      encounters a disturbance or reaches the physical limits of what its motor
      can achieve.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/maple-seed-inspired-ro.jpg
    categories:
      - Robotics
    publishedAt: 2026-09-18T15:00:08.000Z
