  - title: Researchers develop two-level AI framework for more informative steel
      bridge corrosion inspection
    url: https://techxplore.com/news/2026-09-ai-framework-steel-bridge-corrosion.html
    summary: Corrosion is a major concern for aging steel bridges because
      progressive material loss can affect their long-term serviceability and,
      in severe cases, structural safety. Visual inspection remains
      indispensable for assessing bridge condition, but inspectors must evaluate
      corrosion under widely varying conditions, including differences in
      lighting, coating color, shadows, surface deposits, structural geometry
      and accessibility. These factors can make consistent corrosion assessment
      challenging.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/researchers-develop-tw.jpg
    categories:
      - Engineering
    publishedAt: 2026-09-15T20:00:03.000Z
    source: TechXplore — Engineering
  - title: Digit 5 May Be the First Humanoid Robot Worker That’s Truly Safe
    url: https://spectrum.ieee.org/humanoid-robot-safety
    summary: "Despite the recent deluge of videos of humanoid robots doing backflips
      and kung-fu, the actual pace of progress towards humanoids that can do
      economically viable jobs at scale has at times seemed a bit plodding.
      There are some good reasons for this: a humanoid robot needs to be
      powerful enough to do useful work, safe enough for humans to walk past,
      and have enough battery life to limit how much of the day it’s hooked to a
      charger. But all three of those necessary features actively work against
      each other."
    imageUrl: https://spectrum.ieee.org/media-library/a-front-and-an-angled-view-of-a-teal-colored-humanoid-robot-with-arms-bent-at-the-elbow.jpg?id=67776740&width=1245&height=700&coordinates=0%2C187%2C0%2C188
    categories:
      - Humanoid
      - Humanoid-robots
      - Functional-safety
      - Safety
      - Agility-robotics
    publishedAt: 2026-09-15T15:22:30.000Z
    source: IEEE Spectrum — Robotics
  - title: AI imagines a harsher social world, expecting punishment where people
      expect inaction
    url: https://techxplore.com/news/2026-09-ai-harsher-social-world-people.html
    summary: Artificial intelligence (AI) systems, particularly the large language
      models (LLMs) that underpin ChatGPT and similar platforms, are remarkably
      skilled at answering queries about a wide range of topics. However, the
      extent to which they can interpret social situations and predict how
      humans might respond in specific scenarios remains poorly understood.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/ai-overestimates-how-o-1.jpg
