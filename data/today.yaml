  - title: How DARPA Challenged Teams to Bring Robots Into Disaster Triage
    url: https://spectrum.ieee.org/darpa-triage-challenge-final-robots
    summary: On 5 November, 10 teams descended upon a 52-acre mock town in College
      Station, Texas called Disaster City. They were there for a nine-day
      competition to see how well teams of robots and humans could navigate
      simulated catastrophes, like a market ravaged by a tornado and a nighttime
      strike on a military base. At stake? US $2.5 million in prize money.
    imageUrl: https://spectrum.ieee.org/media-library/a-helmeted-woman-calling-out-to-a-quadruped-robot-during-a-simulated-field-disaster.jpg?id=68752154&width=1245&height=700&coordinates=0%2C120%2C0%2C120
