  - title: Multiple cameras can better track a person's identity using geometry and
      appearance
    url: https://techxplore.com/news/2026-08-multiple-cameras-track-person-identity.html
    summary: By combining two complementary clues—camera geometry and visual
      appearance—researchers at the Institute of Science Tokyo, Japan, developed
      a new approach for preserving identities across multiple cameras. The
      method uses epipolar geometry to identify spatially consistent candidate
      matches and appearance similarity to distinguish among possible
      identities. The approach can be integrated with existing single-camera
      tracking systems without requiring environment-specific retraining.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/improving-identity-tra.jpg
    categories:
      - Computer Sciences
    publishedAt: 2026-08-28T16:00:05.000Z
    source: TechXplore — Computer Science
