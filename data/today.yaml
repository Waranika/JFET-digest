    publishedAt: 2026-08-26T12:00:01.000Z
    source: IEEE Spectrum — AI
  - title: IBM Built the Cold War’s Most Powerful Code Breaker for the NSA
    url: https://spectrum.ieee.org/cold-war-codebreaker-nsa-ibm
    summary: At the height of the Cold War, one very specialized computer was so
      secret that the world didn’t know it existed. It ran its jobs up to 200
      times as fast as any other computer of its time. It was the U.S. National
      Security Agency’s main cryptographic processor in operation from the time
      of the Cuban Missile Crisis in 1962 through the Vietnam War and on past
      the 1975 Helsinki Accords. The machine stopped running only when its
      moving parts finally gave out.
    imageUrl: https://spectrum.ieee.org/media-library/two-men-stand-at-1960s-computer-consoles-containing-many-buttons-knobs-dials-and-lights.jpg?id=67651870&width=1245&height=700&coordinates=0%2C187%2C0%2C188
    categories:
      - Ibm
      - Codebreaking
      - Cold-war
      - Cryptography
      - Supercomputing
    publishedAt: 2026-08-25T13:00:01.000Z
    source: IEEE Spectrum — Computing & Chips
  - title: MIT engineers design a better controller for operating construction diggers
    url: https://news.mit.edu/2026/mit-engineers-design-better-controller-operating-construction-diggers-0820
    summary: Anyone who’s ever wrestled with a claw machine at an arcade can
      appreciate the difficulty in pulling and pushing on joysticks, in just the
      right way, to get a mechanical arm to scoop up that one special toy.
      Coordinating the joysticks and connecting their movement to the claw’s
      motion is a type of “mental mapping” that is not immediately intuitive.
      (And it’s what arcade owners depend on to bring players back, again and
      again).
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202608/MIT-DiggerTrainer-01-press.jpg?itok=X5SSiyJU
    categories: []
    publishedAt: 2026-08-20T04:00:00.000Z
    source: MIT Robotics
