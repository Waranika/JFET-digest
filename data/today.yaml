      go where the engineering takes you, and in my case it took me to the
      Scanwheel, a pocket-size wide-screen electromechanical TV with a
      resolution of 4,096 by 20 pixels. Yup, that’s 4K by 20.
    imageUrl: https://spectrum.ieee.org/media-library/a-pocket-sized-drum-shaped-device-displaying-a-strip-of-frames-from-the-steamboat-willy-cartoon.png?id=67675118&width=1245&height=700&coordinates=0%2C17%2C0%2C17
