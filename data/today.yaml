  - title: "Q&A: Rethinking how innovation happens"
    url: https://news.mit.edu/2026/qa-eugene-fitzgerald-rethinking-how-innovation-happens-0818
    summary: "Innovation is a concept that has become mythologized in the modern
      era: what it is, how to manage it, how to teach it, and how to get it to
      work for us. Despite these explorations, it remains fundamentally
      misunderstood, writes Eugene Fitzgerald, the Merton C. Flemings SMA
      Professor in MIT’s Department of Materials Science and Engineering, in his
      latest book, “The Invisible Engine: Why Innovation Evades Control.”"
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202608/MIT-Fitzgerald-Innovation-Book-01-press.jpg?itok=Pl-hiOMe
    categories: []
    publishedAt: 2026-08-17T19:50:00.000Z
    source: MIT Artificial Intelligence
  - title: Mathematical framework connects biological principles to manufacturable,
      adaptive materials
    url: https://news.mit.edu/2026/mathematical-framework-connects-biological-principles-manufacturable-adaptive-material-0817
    summary: The scales of a pine cone open in low humidity to scatter seeds, but
      close in damp conditions to protect seeds from moisture. An artificial
      material with the same behavior could be useful in applications like
      moisture-responsive shingles for passive cooling.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202608/MIT-Compositional-Design-01-press.jpg?itok=nyWSl9at
