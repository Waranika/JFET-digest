  - title: Modified cellulose removes over 99% of lead from methanol-based solar
      cell recycling waste
    url: https://techxplore.com/news/2026-10-cellulose-methanol-based-solar-cell.html
    summary: Conventional metal recovery technologies do not adequately recover
      critical metals from effluents containing hydrophilic organic solvents.
      Researchers investigated dithiocarbamate-functionalized cellulose DPE6 to
      assess how organic solvents affect its metal sorption capability and to
      develop a separation and recovery technology applicable to actual
      effluents. The results show highly efficient critical metal recovery and
      are expected to contribute to the effective use of finite metal resources
      and the realization of a sustainable society. The research is published in
      the journal ACS Applied Materials & Interfaces.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/modified-cellulose-rem.jpg
    categories:
      - Engineering
    publishedAt: 2026-10-06T18:40:11.000Z
    source: TechXplore — Engineering
  - title: New index preserves AI search accuracy as records are added and deleted
    url: https://techxplore.com/news/2026-10-index-ai-accuracy-added-deleted.html
    summary: When new information is continually added and old information is
      removed, an AI system may fail to find the correct material even when that
      material exists. KAIST researchers have developed a vector database
      technology that preserves the search paths leading to the needed
      information as data changes. This allows AI to find up-to-date information
      more accurately and quickly.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/kaist-develops-vector.jpg
    categories:
      - Computer Sciences
    publishedAt: 2026-10-06T15:40:01.000Z
    source: TechXplore — Computer Science
  - title: Scientists finally see how nature moves energy so efficiently
    url: https://www.sciencedaily.com/releases/2026/10/261004001841.htm
    summary: Researchers have captured key steps in a chemical reaction that helps
      nature transfer energy with remarkable efficiency. Ultrafast X-rays
      revealed how changes involving electrons and protons are closely linked to
      the rearrangement of surrounding water molecules. Because similar
      reactions drive photosynthesis and other energy-conversion processes, the
      technique could help scientists develop better catalysts, fuel cells, and
      flow batteries.
    imageUrl: https://www.sciencedaily.com/images/1920/chemistry-catalyst-reaction.webp
    categories: []
    publishedAt: 2026-10-06T07:49:51.000Z
    source: ScienceDaily — Engineering
