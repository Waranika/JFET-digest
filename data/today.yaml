  - title: Ultrasound imaging without the gel
    url: https://news.mit.edu/2026/ultrasound-imaging-without-gel-1119
    summary: Engineers at MIT and the Singapore-MIT Alliance for Research and
      Technology’s Wearable Imaging for Tranforming Elderly Care project (SMART
      WITEC) have developed a dry and stretchy material that could eliminate the
      need for a wet and sticky gel in ultrasound imaging.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202611/MIT-DryUltrasound-01-press.jpg?itok=4qThBA4e
    categories: []
