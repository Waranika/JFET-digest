  - title: Turning the tide on Massachusetts shellfishing data
    url: https://news.mit.edu/2026/turning-tide-massachusetts-shellfishing-data-1007
    summary: "Until recently, when a Massachusetts shellfish warden needed to know
      how much rain had fallen overnight before deciding whether to close a
      shellfishing area, the process might look something like this: call a
      local resident who happened to own a rain gauge, ask for the measurement,
      write it down, and use that number to make the call. Heavy rain may cause
      a closure due to stormwater runoff that can carry pollutants from land to
      water. If the area closed, the public found out the same low-tech way: a
      paper notice at the boat ramp, a phone call, or word passed along at the
      marina."
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202610/quahogs-triantafyllou-00_0.jpg?itok=N6GxH0bE
    categories: []
    publishedAt: 2026-10-07T19:55:00.000Z
    source: MIT Engineering
