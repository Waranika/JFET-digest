  - title: Blockchain system could secure cross-border renewable energy and carbon
      certificate trade
    url: https://techxplore.com/news/2026-11-blockchain-border-renewable-energy-carbon.html
    summary: Researchers have developed a blockchain-based system to improve the
      security of cross-border renewable energy trade and environmental
      certificates. A blockchain is a digital record-keeping system in which
      information is stored in linked blocks and shared across computers, making
      records very difficult, if not impossible, to alter secretly. Although
      associated with cryptocurrencies, it has wider applications.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/blockchain-1.jpg
    categories:
      - Security
    publishedAt: 2026-11-19T18:40:29.000Z
