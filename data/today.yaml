  - title: "InterPet4D: Capturing human–dog interactions to generate AI-based pet
      motion generation"
    url: https://techxplore.com/news/2026-10-interpet4d-capturing-humandog-interactions-generate.html
    summary: Interactions between humans and dogs involve a continuous exchange of
      physical and verbal cues. A person may pet a dog, use a hand gesture, give
      a verbal command or call the pet from a distance, prompting changes in the
      dog's posture, position or movement. Understanding these human–animal
      interactions requires data that captures both participants simultaneously.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/interpet4d-capturing-h.jpg
    categories:
      - Computer Sciences
    publishedAt: 2026-10-02T13:20:23.000Z
    source: TechXplore — Computer Science
  - title: MIT class project turns into an FDA-cleared treatment for tremors
    url: https://news.mit.edu/2026/mit-class-project-turns-into-fda-cleared-treatment-for-tremors-1002
    summary: In 2017, a man named Michael walked onto stage in front of a packed
      Kresge Auditorium at MIT and attempted to draw a spiral, a common test
      doctors use to diagnose Parkinson’s disease. His tremors, caused by the
      disease, made the exercise difficult.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202610/MIT-Encora-Therapeutics-01-press.jpg?itok=1vCDHH4L
    categories: []
    publishedAt: 2026-10-02T04:00:00.000Z
    source: MIT Engineering
  - title: This new qubit could be 100 times less error-prone in superfluid quantum
      computer breakthrough
    url: https://www.sciencedaily.com/releases/2026/09/260930020309.htm
    summary: A proposed qubit made with superfluid helium could cut quantum
      computing error rates by around 100 times by shielding quantum information
      from common forms of electromagnetic noise. If experiments confirm the
      predictions, the technology could eventually work alongside today’s
      superconducting qubits or serve as a new kind of quantum memory.
    imageUrl: https://www.sciencedaily.com/images/1920/majorana-qubits-quantum-entanglement.webp
    categories: []
    publishedAt: 2026-10-01T13:17:13.000Z
    source: ScienceDaily — Computer Science
  - title: This light-powered AI can spot deepfakes with nearly 98% accuracy
    url: https://www.sciencedaily.com/releases/2026/09/260929053534.htm
    summary: UCLA researchers built an AI system that uses light to analyze more
      than a dozen videos simultaneously, detecting deepfakes with nearly 98%
      accuracy. Its speed, low energy demands, and resistance to attacks could
      make it a powerful tool for screening the growing flood of AI-generated
      video.
    imageUrl: https://www.sciencedaily.com/images/1920/optical-ai-technology-that-detects-deepfake-videos.webp
    categories: []
    publishedAt: 2026-10-01T13:03:50.000Z
    source: ScienceDaily — Robotics
  - title: A Brief History of the Bloomberg Terminal
    url: https://spectrum.ieee.org/bloomberg-terminal
    summary: Financial markets have always relied on timely information, and the
      drive for timeliness has always adapted to the latest technology. From
      clipper ships transiting the oceans to telegraph wires connecting cities
      to fiber-optic cables conducting trades in microseconds, traders have
      embraced any advantage to get the most up-to-date information. Indeed, the
      history of finance is really a story about how fast you can move
      information and who controls the interface.
    imageUrl: https://spectrum.ieee.org/media-library/vintage-bloomberg-financial-keyboard-terminal-with-built-in-speaker-and-market-function-keys.jpg?id=67857164&width=1245&height=700&coordinates=0%2C187%2C0%2C188
    categories:
