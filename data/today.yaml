  - title: MIT student team CERBERUZ wins NASA LunaRecycle Centennial Challenge,
      turning lunar trash into tools
    url: https://news.mit.edu/2026/mit-student-team-cerberuz-wins-nasa-lunarecycle-centennial-challenge-1020
    summary: "Establishing a human presence on the moon will require
      state-of-the-art spacecraft, spacesuits, life-support systems, and some of
      the most sophisticated technology humans have ever built. It will also
      require figuring out where to put the garbage.A future lunar outpost will
      receive a steady stream of supplies from Earth, bringing packaging and
      other materials that could quickly become a mountain of waste. Meanwhile,
      astronauts will need tools, replacement parts, and materials to maintain
      the outpost, and shipping supplies from Earth is astronomically expensive.
      An MIT student team has won first prize in a NASA competition for
      developing a way to turn that trash into useful materials for lunar
      living.The Composites for Extraterrestrial Recycling By Engineering the
      Reuse and Upcycling of Zotek (CERBERUZ) team was named first-prize winner
      in both the Prototype and Digital Twin tracks of NASA’s LunaRecycle
      Challenge. The challenge — part of NASA’s Centennial Challenges series —
      asked participants to design and develop solutions that can reuse,
      recycle, or upcycle space waste and improve the sustainability of
      longer-duration lunar missions. Teams were encouraged to envision
      solutions that not only addressed recycling in deep space, but could also
      have applications on Earth.The CERBERUZ team’s system turns otherwise
      unusable waste into new composite materials, grinding it down, melting it,
      and molding it into useful parts. The approach reduces the need for costly
      shipments from Earth and keeps bulky packaging from piling up in lunar
      landfills.“Waste packaging materials will inevitably accumulate when a
      lunar outpost is built, and at the same time, outpost construction and
      maintenance will require a steady supply of new materials, including
      replacement parts,” says George Lordos, a research scientist in the MIT
      Department of Aeronautics and Astronautics and System Design and
      Management, and the lead advisor for the CERBERUZ team. “Recycling waste
      materials into such parts can help reduce materials needed to be launched
      from Earth.”Waste not, want notCERBERUZ separates non-biological waste
      into two streams: thermoplastics and everything else. All materials are
      then ground into a fine powder and mixed together. The powder mixture is
      loaded into an injection molding machine, where the thermoplastics melt
      with the remaining materials suspended in the molten plastic. The mixture
      is finally injected into a mold, producing high-quality composite parts
      that can be quickly and reliably replicated."
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202610/mit-aeroastro-CERBERUZ-Team.jpg?itok=AvNsUrA6
    categories: []
    publishedAt: 2026-10-20T21:30:00.000Z
    source: MIT Engineering
