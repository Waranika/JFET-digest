  - title: Chatbots Are Leading Hikers Astray, With Dangerous Consequences
    url: https://www.wired.com/story/chatbots-are-leading-hikers-astray-with-dangerous-consequences/
    summary: Outsourcing planning to AI can lead people to surrender their own
      critical thinking, which can have potentially deadly results in places
      like the backcountry.
