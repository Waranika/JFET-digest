  - title: NSF’s X-Labs Program Draws Support From Charities and Investors
    url: https://spectrum.ieee.org/national-science-foundation-x-labs
    summary: When the U.S. National Science Foundation began its X-Labs program in
      May, the agency said the higher-risk, higher-funded awards would create
      new kinds of partnerships that would confront urgent scientific and
      technological challenges. Now the NSF is doubling down on the idea, with
      an announcement in October that charities, companies, and investment funds
      would provide X-Lab winners practical support such as laboratory space,
      software, shared equipment, and access to key data and expert guidance.
    imageUrl: https://spectrum.ieee.org/media-library/three-men-conversing-in-front-of-a-construction-sign-on-a-dirt-lot.jpg?id=68653956&width=1245&height=700&coordinates=0%2C156%2C0%2C157
    categories:
      - National-science-foundation
