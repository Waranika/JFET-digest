  - title: A hidden “on switch” in human DNA has finally been decoded
    url: https://www.sciencedaily.com/releases/2026/08/260823014943.htm
    summary: Researchers have used AI to uncover the DNA signature of a key genetic
      “switch” involved in turning genes on. After analyzing about 500,000 DNA
      sequences, the model identified the initiator in roughly 60% of human
      genes. The breakthrough could help predict the effects of harmful
      mutations and eventually contribute to decoding the broader genetic
      instructions that control gene activity throughout the body.
    imageUrl: https://www.sciencedaily.com/images/1920/biological-dna-structure-with-gene-mutation.webp
    categories: []
    publishedAt: 2026-08-23T12:14:40.000Z
