  - title: AI can act exactly like a human, but we still don't think it's conscious
    url: https://www.sciencedaily.com/releases/2026/10/261012185017.htm
    summary: A new study reveals that people draw a surprisingly sharp line between
      human consciousness and artificial intelligence, even when both behave
      identically. Researchers found that participants considered even the most
      responsive AI less conscious than the least responsive human. Yet when
      asked about "awareness" instead, people judged humans and AI much more
      similarly.
    imageUrl: https://www.sciencedaily.com/images/1920/human-vs-ai-brain-thinking-understanding.webp
    categories: []
    publishedAt: 2026-10-14T01:41:55.000Z
    source: ScienceDaily — Robotics
  - title: "Q&A: Mars Perseverance Rover Sets a Distance Record"
    url: https://spectrum.ieee.org/mars-rover-distance-record
    summary: On October 11, the Perseverance rover completed a drive that brought
      its total distance traveled on Mars to 28.10 miles (45.22 kilometers).
      This is a new record for Mars rovers, enabled in large part by
      Perseverance’s ability to drive with much more autonomy than its
      predecessors. Over the last five years, Perseverance’s autonomy software
      has been steadily upgraded, and to learn more about how the record was
      broken and what the future holds for the rover, we spoke with Mark
      Maimone, the Perseverance Robotic Operations Deputy Team Chief at NASA’s
      Jet Propulsion Laboratory, who designed and developed the self-driving
      software for Mars rovers Spirit, Opportunity, Curiosity, and Perseverance.
    imageUrl: https://spectrum.ieee.org/media-library/a-long-trail-of-tire-tracks-left-across-mars-dusty-surface-by-a-space-rover.jpg?id=68423735&width=1245&height=700&coordinates=0%2C312%2C0%2C312
    categories:
      - Mars-rovers
      - Perseverance-rover
      - Self-driving-cars
      - Autonomous-vehicles
    publishedAt: 2026-10-13T15:02:04.000Z
    source: IEEE Spectrum — Robotics
  - title: Google DeepMind’s New Resident Philosopher Tackles AI Ethics
    url: https://spectrum.ieee.org/ai-ethics-deepmind-philosopher-shevlin
    summary: "How should humans relate to generative AI? In what ways do we, or
      should we, treat a large language model (LLM) as if it were a person? If
      an AI became conscious, how could we tell? Does it make sense to think AI
      could someday have moral rights? These are among the cognitive and ethical
      questions that occupied philosopher Henry Shevlin at Cambridge
      University’s Leverhulme Centre for the Future of Intelligence. But last
      May, Shevlin became part of the growing cohort of philosophers who work
      inside leading artificial intelligence companies. Though he remains active
      at Cambridge, he now spends 80 percent of his time at Google DeepMind (job
      title: “Philosopher”)."
    imageUrl: https://spectrum.ieee.org/media-library/a-white-man-with-shoulder-length-brown-hair-smiling-softly-in-front-of-a-bookshelf.jpg?id=67861702&width=2000&height=1500&coordinates=0%2C0%2C0%2C0
    categories:
      - Ai-ethics
      - Google-deepmind
      - Philosophy
      - Artificial-intelligence
    publishedAt: 2026-10-13T13:00:03.000Z
    source: IEEE Spectrum — AI
  - title: Scientists recreate a bizarre quantum effect that stops a particle cold
    url: https://www.sciencedaily.com/releases/2026/10/261011211554.htm
    summary: Oxford physicists have recreated a bizarre quantum effect in which a
      particle responds to a magnetic field without ever traveling through it.
      Using a hybrid quantum computer, they demonstrated how introducing a
      simulated magnetic flux could completely halt a particle's movement
      through quantum interference. The experiment brings a decades-old
      prediction into a new setting where matter and quantum fields influence
      one another.
    imageUrl: https://www.sciencedaily.com/images/1920/hybrid-quantum-system-loop.webp
    categories: []
    publishedAt: 2026-10-13T09:47:22.000Z
    source: ScienceDaily — Computer Science
