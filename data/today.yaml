  - title: This light-powered AI can spot deepfakes with nearly 98% accuracy
    url: https://www.sciencedaily.com/releases/2026/09/260929053534.htm
    summary: UCLA researchers built an AI system that uses light to analyze more
      than a dozen videos simultaneously, detecting deepfakes with nearly 98%
      accuracy. Its speed, low energy demands, and resistance to attacks could
      make it a powerful tool for screening the growing flood of AI-generated
      video.
    imageUrl: https://www.sciencedaily.com/images/1920/optical-ai-technology-that-detects-deepfake-videos.webp
