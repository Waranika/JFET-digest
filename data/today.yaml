  - title: NASA just used satellites and debris to navigate without GPS
    url: https://www.sciencedaily.com/releases/2026/08/260826055450.htm
    summary: NASA has successfully tested a system that allows satellites to
      navigate without GPS by using other spacecraft and debris as landmarks in
      orbit. In just three days, FALCON also improved the known orbits of more
      than 200 space objects completely autonomously.
    imageUrl: https://www.sciencedaily.com/images/1920/nasa-starling-swarm-mission.webp
