  - title: AI helps digital humans move more naturally as they speak
    url: https://techxplore.com/news/2026-11-ai-digital-humans-naturally.html
    summary: People communicate with more than words. A raised hand, a change in
      posture or a facial expression can help convey meaning and emotion. Now,
      researchers have developed an artificial intelligence (AI) system that can
      translate speech into coordinated movements of the body, hands and face,
      potentially making digital characters and virtual presenters more
      expressive and lifelike.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/ai-helps-digital-human.jpg
    categories:
      - Computer Sciences
    publishedAt: 2026-11-13T16:40:01.000Z
