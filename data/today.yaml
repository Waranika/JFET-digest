  - title: New AI technique could make minimally invasive surgeries safer and more
      precise
    url: https://news.mit.edu/2026/new-ai-technique-could-make-minimally-invasive-surgeries-safer-more-precise-0916
    summary: Researchers created a new technique that accurately and rapidly matches
      X-rays captured during surgery with a patient’s preoperative 3D medical
      scan. This method could make it easier for clinicians to precisely pilot
      minimally invasive surgical tools, leading to faster and safer procedures.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202609/MIT-VolumeRegistration-01-press.jpg?itok=oHDoDATr
