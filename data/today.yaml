  - title: "Q&A: The “collision” between AI, your brain, and society"
    url: https://news.mit.edu/2026/collision-between-ai-your-brain-and-society-eric-so-book-1015
    summary: "As artificial intelligence use becomes more widespread, scholars are
      working to understand its effects on the people who use it. MIT Professor
      Eric So offers one of the most complete syntheses yet, in his new book,
      “The Collision: What AI Does to Us,” published this month by W.W. Norton.
      Recognizing that AI offers opportunities to complete work faster, and in
      some cases has been turned into useful domain-specific tools, So
      nonetheless looks at the costs of relying on it too broadly. He contends
      that heavy use of AI can lead to a kind of cognitive atrophy, in which
      people fail to develop and retain essential thinking skills. In general,
      he says, evidence shows that our ability to learn gets dramatically better
      when we wrestle with material, work through initial failures, keep
      iterating, and in the process acquire better thinking skills while
      retaining more knowledge."
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202610/MIT-3Q-Collision-01-press_1.jpg?itok=BLOydoCM
    categories: []
    publishedAt: 2026-10-15T04:00:00.000Z
    source: MIT Artificial Intelligence
  - title: Eye-inspired cameras help new system detect fast-moving drones in complex
      skies
    url: https://techxplore.com/news/2026-10-eye-cameras-fast-drones-complex.html
    summary: Southwest Research Institute (SwRI) has developed a new tool that uses
      neuromorphic cameras to detect unmanned aerial system (UAS) drones. SwRI's
      Hierax system pairs event-based cameras, dynamic sensing technology that
      mimics the power of human eyesight, with custom software to detect
      fast-moving drones in complex aerial scenarios.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/drone-detection-system.jpg
