  - title: AI Text Watermarking May Not Be Able to Meet the E.U.’s New Rules
    url: https://spectrum.ieee.org/ai-watermark-openai-textgrain-europe
    summary: The European Union now requires AI-generated text to be watermarked so
      that it can be identified as such. But tests on OpenAI’s new textGrain
      watermark, released in October and developed to comply with the new E.U.
      law, show that these watermarks often do not survive additional editing of
      the text or when it’s under 150 words. With no clear legal benchmark for
      how well watermarks should work, it’s uncertain whether textGrain will
      meet Europe’s transparency rules, which could cost the company
      significantly and make it difficult to detect AI-generated text as models
      grow more sophisticated.
    imageUrl: https://spectrum.ieee.org/media-library/conceptual-illustration-of-the-european-union-flag-with-its-stars-replaced-by-logos-for-open-ai.jpg?id=68564327&width=1245&height=700&coordinates=0%2C469%2C0%2C469
    categories:
