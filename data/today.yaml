  - title: Physicists create a tiny “Big Bang” with surprisingly small atomic nuclei
    url: https://www.sciencedaily.com/releases/2026/08/260822015143.htm
    summary: Researchers at CERN have created microscopic versions of the early
      Universe by colliding surprisingly small atomic nuclei at nearly the speed
      of light. The collisions produced quark-gluon plasma, the ultra-hot matter
      believed to have filled the cosmos shortly after the Big Bang. Even more
      intriguingly, the particles left behind reveal the shape of the nuclei
      that created them, offering a new way to probe both nuclear physics and
      the Universe’s earliest moments.
    imageUrl: https://www.sciencedaily.com/images/1920/neon-20-and-oxygen-16-collisions.webp
    categories: []
    publishedAt: 2026-08-23T13:08:55.000Z
    source: ScienceDaily — Engineering
