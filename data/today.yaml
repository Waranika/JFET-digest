  - title: IBM Built the Cold War’s Most Powerful Code Breaker for the NSA
    url: https://spectrum.ieee.org/cold-war-codebreaker-nsa-ibm
    summary: At the height of the Cold War, one very specialized computer was so
      secret that the world didn’t know it existed. It ran its jobs up to 200
      times as fast as any other computer of its time. It was the U.S. National
      Security Agency’s main cryptographic processor in operation from the time
      of the Cuban Missile Crisis in 1962 through the Vietnam War and on past
      the 1975 Helsinki Accords. The machine stopped running only when its
      moving parts finally gave out.
    imageUrl: https://spectrum.ieee.org/media-library/two-men-stand-at-1960s-computer-consoles-containing-many-buttons-knobs-dials-and-lights.jpg?id=67651870&width=1200&height=400&coordinates=0%2C417%2C0%2C417
    categories:
