  - title: Scientists are building a microscope powered by a quantum computer
    url: https://www.sciencedaily.com/releases/2026/09/260912220038.htm
    summary: Scientists are combining an electron microscope with a quantum computer
      to squeeze far more information from each electron. The approach could
      reveal faint details with fewer electrons, helping protect fragile samples
      that conventional microscopy can damage.
    imageUrl: https://www.sciencedaily.com/images/1920/artistic-visualization-of-quantum-electron-microscope.webp
