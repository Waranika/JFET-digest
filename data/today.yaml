  - title: Robots learn human movement patterns to find paths through dense crowds
    url: https://techxplore.com/news/2026-11-robots-human-movement-patterns-paths.html
    summary: Navigating a bustling train station or airport is a major challenge for
      people with visual impairments. New research from Örebro University
      teaches robots to follow the "unwritten rules" of human movement and make
      their way through dense crowds. In the long term, the technology could
      serve as a digital complement to guide dogs.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/dense-crowds.jpg
    categories:
      - Robotics
    publishedAt: 2026-11-18T12:00:10.000Z
    source: TechXplore — Robotics
  - title: Will AI Coding Eat Video Game Engines?
    url: https://spectrum.ieee.org/epic-games-unreal-engine-ai
    summary: When Travis McGeathy’s studio, Seeker Entertainment, ran out of funding
      in September, its game KinForge went down with it. KinForge was an online
      game built in Unreal Engine 5.7 and designed to run on servers hosted by
      Amazon Web Services (AWS). With no one left to pay the server bill, the
      game became unplayable even for those few developers, including studio
      co-founder McGeathy, who had the code.
    imageUrl: https://spectrum.ieee.org/media-library/a-game-development-software-being-used-to-generate-and-refine-images-videos-and-3d-models-of-an-1800s-saloon-setting-for-a-vi.jpg?id=68705132&width=1200&height=800&coordinates=0%2C198%2C0%2C199
    categories:
