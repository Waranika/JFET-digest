  - title: AI reduces sensory hallucinations, even at night or in smoke
    url: https://techxplore.com/news/2026-07-ai-sensory-hallucinations-night.html
    summary: Multimodal large language models (MLLMs), which process multiple types
      of sensory information, such as text, images and audio, at the same time,
      are rapidly expanding the range of applications for artificial
      intelligence (AI). However, in real-world environments, these models can
      misinterpret the physical characteristics of sensors, mistakenly identify
      objects or claim to hear sounds that are not actually present simply
      because a certain object appears in a video. These errors are known as
      hallucinations.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/kaist-develops-ai-that-5.jpg
    categories:
      - Hi Tech & Innovation
    publishedAt: 2026-08-01T13:40:01.000Z
    source: TechXplore — AI & Machine Learning
  - title: Scientists map moon regolith to aid lunar bases
    url: https://techxplore.com/news/2026-07-scientists-moon-regolith-aid-lunar.html
    summary: A strong foundation is key to any building, and this doesn't apply only
      to construction on Earth. As humanity slowly expands throughout the many
      worlds of our solar system, and possibly beyond, understanding planetary
      surfaces is key to constructing long-lasting habitats beyond Earth. Thus,
      it's only natural that this venture begins with our own moon, NASA's
      target for a permanent base at the lunar south pole. While the moon is
      covered by a thin layer of dust, also called regolith, engineers need to
      know the thickness of this regolith to identify the safest locations for
      future lunar habitats and buildings.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/scientists-map-moon-re.jpg
    categories:
      - Engineering
    publishedAt: 2026-08-01T12:00:04.000Z
    source: TechXplore — Engineering
