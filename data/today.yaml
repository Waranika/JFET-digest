  - title: Harvard’s tiny UV light chip could help shrink quantum computers
    url: https://www.sciencedaily.com/releases/2026/11/261126063333.htm
    summary: Harvard-led researchers have developed a microscopic device that
      generates 120 times more ultraviolet light than previous comparable
      approaches by efficiently converting red light into UV. The breakthrough
      could unlock smaller quantum computers, ultra-precise atomic clocks, and
      compact environmental sensors.
    imageUrl: https://www.sciencedaily.com/images/1920/sidewall-poled-lithium-niobate-device.webp
