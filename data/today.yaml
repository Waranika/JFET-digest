      Humanoid Robots"
    url: https://content.knowledgehub.wiley.com/learning-to-play-like-a-pro-adaptive-motion-planning-and-tracking-for-humanoid-robots/
    summary: This White Paper provides roboticists and control engineers with a
      comprehensive overview of how motion planning and motion tracking can be
      decoupled to preserve professional athletic style in humanoid robots, and
      why adaptive, speed-aware control is essential for closing the gap between
