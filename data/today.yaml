  - title: AI helps design new materials that work in the real world
    url: https://news.mit.edu/2026/ai-helps-design-new-materials-that-work-in-real-world-0826
    summary: Today, anyone with a large enough artificial intelligence model can
      generate millions of new material designs in minutes. Unfortunately, that
      hasn’t led to a huge leap in the number of new materials being used to
      improve the performance of products like computer chips and rockets.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202608/MIT-Valence-01-press.jpg?itok=OJTlsBvb
