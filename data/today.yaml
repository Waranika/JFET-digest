  - title: Background static can carry wireless data without an actively generated
      radio signal
    url: https://techxplore.com/news/2026-10-background-static-wireless-generated-radio.html
    summary: Stanford researchers recently revealed how a seemingly physics-defying
      wireless communication technology works. The new technology, called
      thermal noise communication, harnesses background static that normally is
      the bane of radio, cellular and other wireless signals. In their new study
      published in the Proceedings of the National Academy of Sciences, the team
      showed how a transmitter could deliver data to a receiver without any
      actively produced signal by manipulating tiny oscillations in voltage.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/thermal-noise-used-to.jpg
    categories:
      - Engineering
    publishedAt: 2026-10-20T19:20:01.000Z
    source: TechXplore — Engineering
