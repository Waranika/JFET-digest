  - title: "Metabolic architecture: Living systems design could out-perform
      conventional HVAC"
    url: https://techxplore.com/news/2026-09-metabolic-architecture-conventional-hvac.html
    summary: A new study led by researchers at the Yale Center for Ecosystems and
      Architecture (Yale CEA), together with NYU, Purdue, YSE, Buro Happold and
      others, shows how plant-based biofilters could help reduce indoor CO2 to
      levels below those found outdoors. Conventional HVAC systems cannot
      achieve this through ventilation alone, making this approach increasingly
      relevant as climate change drives higher CO2 concentrations and greater
      demands on indoor environments. The findings are published in the journal
      Energy and Buildings.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/metabolic-architecture.jpg
    categories:
      - Engineering
    publishedAt: 2026-09-27T18:40:01.000Z
    source: TechXplore — Engineering
