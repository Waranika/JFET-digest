  - title: Robot AI predicts future scenes to guide its next moves
    url: https://techxplore.com/news/2026-10-robot-ai-future-scenes.html
    summary: A robot artificial intelligence (AI) system has been developed that can
      understand human instructions, predict what a scene will look like after
      an action and then carry out the task. Rather than simply translating
      instructions into physical movements, the technology also uses the
      anticipated outcomes of those actions to control the robot.
