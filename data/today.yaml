  - title: MIT Schwarzman College of Computing launches pilot to help educators
      teach AI across disciplines
    url: https://news.mit.edu/2026/mit-schwarzman-college-computing-launches-pilot-help-educators-teach-ai-across-disciplines-0909
    summary: This summer, the MIT Schwarzman College of Computing welcomed faculty
      from colleges and universities across Greater Boston, South Carolina, West
      Virginia, and Texas to campus for the inaugural AI Educators Pilot, a
      weeklong workshop aimed at expanding how artificial intelligence is taught
      across disciplines and learning environments. Inspired by MIT class
      C01/C51 (Modeling with Machine Learning), a course developed through
      the Common Ground for computing and AI education that focuses on helping
      students understand and apply foundational AI and machine learning
      concepts to problem-solving in their own disciplines, the workshop gave
      educators an opportunity to explore how its materials and teaching methods
      could be adapted for their classrooms.
    imageUrl: https://news.mit.edu/sites/default/files/styles/news_article__cover_image__original/public/images/202608/mit-schwarzman-AI-EDUCATORS.jpg?itok=7n4L56BI
    categories: []
    publishedAt: 2026-09-09T20:40:00.000Z
    source: MIT Artificial Intelligence
  - title: AI Models Are Watermarking Text—Will You Notice?
    url: https://spectrum.ieee.org/ai-watermark-text-anthropic-openai
    summary: On 11 August, Anthropic announced that all future Claude models will
      generate text that contains a watermark that identifies its results as AI
      generated. The company is not alone. Google has its own text watermark
      (which Anthropic’s is based on) it uses on the output of its Gemini
      models. OpenAI has yet to introduce a text watermark but it plans to do
      so.
    imageUrl: https://spectrum.ieee.org/media-library/conceptual-illustration-of-a-cursor-symbol-for-editing-text-set-against-a-green-background-with-sporadic-pieces-highlighted-in-r.jpg?id=67710314&width=1245&height=700&coordinates=0%2C187%2C0%2C188
    categories:
      - Generative-ai
      - Watermark
      - Large-language-models
      - Anthropic
      - Openai
      - Google
    publishedAt: 2026-09-09T12:00:04.000Z
    source: IEEE Spectrum — AI
  - title: Chinese scientists find a hidden atomic structure that unlocks methane
    url: https://www.sciencedaily.com/releases/2026/09/260909005148.htm
    summary: Scientists found that a tiny atomic structure that forms on nickel
      oxide during methane conversion is more effective than the metallic nickel
      long believed to drive the reaction. The discovery allowed a low-nickel
      catalyst to rival one containing 10 times more metal, potentially opening
      the door to cheaper and more efficient industrial catalysts.
    imageUrl: https://www.sciencedaily.com/images/1920/ni1o4ni4-active-structure.webp
    categories: []
    publishedAt: 2026-09-09T05:33:42.000Z
    source: ScienceDaily — Engineering
  - title: Scientists find a way to slash computer memory energy use by orders of
      magnitude
    url: https://www.sciencedaily.com/releases/2026/09/260906170132.htm
    summary: Scientists have devised a new way to switch magnetic computer memory
      while using far less energy than today's leading technologies. By
      mathematically optimizing the pulses used to flip digital bits, the method
      could reduce energy consumption by several orders of magnitude.
      Simulations suggest it may bring future memory devices surprisingly close
      to the fundamental physical limit for processing information. The same
      idea could eventually work with electrical currents or ultrafast lasers.
    imageUrl: https://www.sciencedaily.com/images/1920/magnetic-memory-technologies.webp
    categories: []
    publishedAt: 2026-09-07T01:14:19.000Z
    source: ScienceDaily — Robotics
