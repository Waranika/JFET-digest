  - title: "Systems and Software Outages Explained: Who or What Is Responsible?"
    url: https://spectrum.ieee.org/it-outage
    summary: Last Thursday, Microsoft 365 Exchange Online and related apps like
      Outlook and Teams went down in at least 74 countries. The next day the
      U.S. Federal Aviation Administration ordered a full nationwide groundstop.
      Every airport in the United States stopped sending planes into the sky,
      and those already in the air had to come back down. On Monday, Chase Bank
      customers couldn’t get into their accounts for the better part of the day.
      Then United Airlines suffered an outage. And on Tuesday, the U.S. National
      Security Agency’s classified communications network went down.
    imageUrl: https://spectrum.ieee.org/media-library/a-silhouetted-man-looks-at-airport-information-screens.jpg?id=68722768&width=1245&height=700&coordinates=0%2C109%2C0%2C110
