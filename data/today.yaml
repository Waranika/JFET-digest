  - title: Periodic voltage fluctuations can 'see' inside lithium batteries, no
      disassembly required
    url: https://techxplore.com/news/2026-09-periodic-voltage-fluctuations-lithium-batteries.html
    summary: Monitoring the lifespan of a lithium-ion battery without disassembling
      it may be possible. This prospect emerged from a study published in May in
      the journal Cell Reports Physical Science by researchers at the State
      University of Campinas (UNICAMP) in the state of São Paulo, Brazil, and
      their collaborators. The scientists created an advanced computational
      model to investigate these energy sources and discovered that natural
      voltage fluctuations act as an "X-ray" of the system. This reveals the
      microscopic structure of battery materials and the speed of the chemical
      reactions occurring within them. The finding paves the way for rapid,
      low-cost diagnostics in energy storage.
    imageUrl: https://scx2.b-cdn.net/gfx/news/hires/2026/periodic-voltage-fluct.jpg
    categories:
      - Engineering
    publishedAt: 2026-09-14T20:40:04.000Z
    source: TechXplore — Engineering
