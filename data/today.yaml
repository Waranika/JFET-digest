  - title: AI framework rooted in cognitive science could complete tasks more
      efficiently
    url: https://techxplore.com/news/2026-07-ai-framework-rooted-cognitive-science.html
    summary: In recent years, computer scientists have developed a wide range of
      artificial intelligence (AI) models that can rapidly recognize patterns in
      data, generate content and solve other computational problems. Many of
      these AI systems are based on deep neural networks (DNNs), brain-inspired
      computational models that can make predictions based on specific data, or
      LLMs, models that can process human language, answer queries and generate
      text.
