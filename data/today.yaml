  - title: Are AI Models Working Harder Than They Need to?
    url: https://spectrum.ieee.org/ai-energy-weightless-neural-networks
    summary: Much of modern AI runs on multiplication. Neural networks behind
      everything from generated answers to photo organization and song
      recommendations perform millions or billions of operations that multiply
      inputs by learned weights. Lizy K. John thinks that’s more work than the
      job requires.
    imageUrl: https://spectrum.ieee.org/media-library/a-middle-aged-indian-woman-in-professional-attire-smiling-while-holding-an-fpga-board.jpg?id=67554240&width=1245&height=700&coordinates=0%2C187%2C0%2C187
