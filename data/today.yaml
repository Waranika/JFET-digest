      - Nuclear-power
    publishedAt: 2026-09-02T13:00:04.000Z
    source: IEEE Spectrum — AI
  - title: Cash In on the AI Boom by Renting Out Your Spare Compute
    url: https://spectrum.ieee.org/ai-inference-distributed-computing
    summary: If you own an at-home server, a gaming computer, or just a laptop that
      doesn’t get much love, listen up. You can now put that spare computing
      power to use and earn some passive income in the process. AI companies are
      hungry for more compute to run AI inference—the process of using a
      pretrained model to respond to queries—and they’re willing to pay you for
      it.
    imageUrl: https://spectrum.ieee.org/media-library/a-small-makeshift-server-rack-in-someones-garage.jpg?id=67703292&width=1245&height=700&coordinates=0%2C62%2C0%2C63
