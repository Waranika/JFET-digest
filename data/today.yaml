  - title: Laser pulses can track extreme airflow in tests for hypersonic spacecraft
    url: https://techxplore.com/news/2026-10-laser-pulses-track-extreme-airflow.html
    summary: Researchers from The University of Texas at Arlington's Aerodynamics
      Research Center have published a study in the journal Communications
      Engineering. Their work details a laser-based technique applied to arc-jet
      flows that could transform how scientists measure hypersonic airflow, such
      as the extreme conditions encountered by spacecraft reentering Earth's
      atmosphere.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/laser-pulses-track-pla.jpg
    categories:
      - Engineering
    publishedAt: 2026-10-30T17:20:22.000Z
