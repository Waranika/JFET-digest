  - title: Shape-sensing sheet digitally tracks its movement as it bends and twists
    url: https://techxplore.com/news/2026-10-sheet-digitally-tracks-movement.html
    summary: MIT engineers have developed a flexible, shape-sensing sheet that
      digitally reconstructs its own form as it bends and twists. The sensor is
      similar in principle to some motion-capture garments, which track a
      person's physical movements to mimic them in a virtual avatar. Those
      designs use rigid sensors that are stitched into a suit at strategic
      locations.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/shape-sensing-sheet-di.jpg
    categories:
      - Engineering
    publishedAt: 2026-10-09T17:00:01.000Z
    source: TechXplore — Engineering
  - title: Neural network study sheds light on how AI chatbots 'reason' like humans
    url: https://techxplore.com/news/2026-10-neural-network-ai-chatbots-humans.html
    summary: When humans write sentences or solve math problems, they are thinking
      symbolically—each number, variable or word is expressed by a symbol. While
      AI chatbots do not "think" that way, if prompted, they can offer cogent
      advice about writing, math and many other topics as if a person were
      offering it.
    imageUrl: https://scx2.b-cdn.net/gfx/news/2026/how-do-ai-chatbots-rea.jpg
    categories:
      - Computer Sciences
    publishedAt: 2026-10-09T15:40:08.000Z
    source: TechXplore — Computer Science
