  - title: IEEE Course Teaches How to Use AI to Modernize Power Grids
    url: https://spectrum.ieee.org/ieee-course-ai-power-grids
    summary: Today’s U.S. electrical grid, among the largest, most complex systems
      ever built, is operating at its limit. The combination of rapid industrial
      growth, more frequent extreme weather, and a record surge in electricity
      use has pushed the grid to its breaking point, according to the U.S.
      Department of Energy.
    imageUrl: https://spectrum.ieee.org/media-library/conceptual-illustration-of-a-man-holding-a-ginormous-lightbulb-with-ai-written-on-it.jpg?id=67568096&width=1245&height=700&coordinates=0%2C187%2C0%2C188
