  - title: Helping AI text detectors keep up with changing conditions
    url: https://news.mit.edu/2026/helping-ai-text-detectors-keep-up-with-changing-conditions-1118
    summary: A teacher who believes a student’s term paper may have been written by
      a large language model (LLM) can use a tool for detecting artificial
      intelligence-generated text to help confirm their suspicions. But the
      teacher may want to think twice before putting all their trust in the
      detector.
